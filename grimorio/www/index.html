<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Grimório — assistente financeiro</title>
<meta name="theme-color" content="#0B0B0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grimório">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  /* Neutros quentes, sem o azulado que denuncia tema genérico */
  --fundo:#0B0B0C;
  --superficie:#111112;
  --superficie2:#171718;
  --tinta:#EDEBE7;
  --tinta2:#9A9893;
  --tinta3:#65635F;
  --risco:rgba(255,255,255,.075);
  --risco2:rgba(255,255,255,.13);

  /* Três cores. Só três. */
  --destaque:#C89A4E;
  --positivo:#6E9E72;
  --negativo:#C4574A;

  /* Nomes antigos mantidos para não quebrar o código, todos neutros */
  --azul:var(--tinta2); --violeta:var(--tinta2); --ambar:var(--destaque);
  --verde:var(--positivo); --brasa:var(--negativo); --ouro:var(--destaque);
  --acc:var(--destaque);

  --sans:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --serif:'Instrument Serif',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;height:100%}
body{
  margin:0;height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  font-family:var(--sans);font-size:16px;line-height:1.5;color:var(--tinta);background:#000;
  display:flex;justify-content:center;align-items:center;padding:20px 12px;
  font-variant-numeric:tabular-nums;
}
@media(max-width:640px){body{padding:0;align-items:stretch}}
.phone{position:relative;width:100%;max-width:420px;height:100vh;height:min(920px,calc(100dvh - 40px));
  display:flex;flex-direction:column;overflow:hidden;background:var(--fundo);
  border:1px solid #1C1C1E;border-radius:18px}
@media(max-width:640px){.phone{border:0;border-radius:0;max-width:none;height:100vh;height:100dvh}}

/* ── cabeçalho ── */
header{flex:none;z-index:4;user-select:none;display:flex;align-items:center;gap:12px;
  padding:calc(14px + env(safe-area-inset-top)) 20px 13px;
  border-bottom:1px solid transparent;background:var(--fundo);transition:border-color .2s}
header[data-scrolled="1"]{border-bottom-color:var(--risco)}
header .who{flex:1;min-width:0}
header .who .hi{font-size:12px;color:var(--tinta3);line-height:1.2;letter-spacing:.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .who .tt{font-family:var(--serif);font-size:21px;line-height:1.15;margin-top:1px;letter-spacing:0}
.avatar{width:34px;height:34px;flex:none;border-radius:8px;cursor:pointer;border:1px solid var(--risco2);
  background:none;color:var(--tinta2);font-family:var(--sans);font-size:13px;font-weight:600;
  display:grid;place-items:center;letter-spacing:.02em}
.avatar:active{background:var(--superficie2)}
.icobtn{width:34px;height:34px;flex:none;display:grid;place-items:center;background:none;
  border:1px solid var(--risco2);border-radius:8px;color:var(--tinta2);font-size:14px;cursor:pointer;font-family:var(--sans)}
.icobtn:active{background:var(--superficie2)}
.icobtn:focus-visible,.avatar:focus-visible{outline:1px solid var(--destaque);outline-offset:2px}

main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;padding:0 20px 96px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
main[data-chat="1"]{padding-bottom:12px}
main[data-anim="1"]{animation:entra .2s ease}
@keyframes entra{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){main[data-anim="1"]{animation:none}}

/* ── seções: rótulo pequeno, sem caixa ── */
.sec{margin-top:30px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px;
  padding-bottom:8px;border-bottom:1px solid var(--risco)}
.sec-h h2{margin:0;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--tinta3)}
.sec-h .cnt{font-size:12px;color:var(--tinta3);letter-spacing:.02em}
.sec-h button{background:none;border:0;color:var(--destaque);font-family:var(--sans);font-size:13px;
  cursor:pointer;padding:6px 0;min-height:34px;letter-spacing:.01em}

/* ── blocos: superfície única, sem degradê nem brilho ── */
.card{margin:14px 0 0;background:none}
.card>.in{padding:0}
.card.tap{cursor:pointer}
.card.tap:active{opacity:.65}
.caixa>.in,.card.caixa>.in{background:var(--superficie);border:1px solid var(--risco);
  border-radius:10px;padding:16px}
.chead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.chead .sg{display:none}
.chead .nm{flex:1;font-size:15px;font-weight:500;letter-spacing:-.005em}
.chead .ex{font-size:15px;color:var(--tinta3);line-height:1}

/* ── números ── */
.mono{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hero{padding:26px 0 6px}
.hero .lbl{font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--tinta3)}
.hero .big{font-family:var(--serif);font-size:clamp(40px,13vw,52px);line-height:1;margin-top:10px;
  letter-spacing:-.02em;color:var(--tinta)}
.hero .sub{font-size:14px;color:var(--tinta2);margin-top:12px;line-height:1.5;max-width:none}
.hero .sub b{font-weight:500;color:var(--tinta)}
.val-md{font-size:16px;font-weight:500}

/* ── listas: fio fino, sem ícone colorido ── */
.row{display:flex;align-items:baseline;gap:14px;min-height:52px;padding:13px 0;border-bottom:1px solid var(--risco)}
.row:last-child{border-bottom:0}
.row .ic{display:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15px;font-weight:400;letter-spacing:-.005em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tx span{display:block;font-size:12.5px;color:var(--tinta3);margin-top:3px}
.row .rt{text-align:right;flex:none}
.row .rt b{display:block;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.row.click{cursor:pointer}
.row.click:active{opacity:.6}

.pill{display:inline-block;margin-top:4px;padding:0;border-radius:0;background:none!important;
  font-size:11.5px;font-weight:500;letter-spacing:.04em;text-transform:lowercase;white-space:nowrap}
.pill.ok{color:var(--positivo)}
.pill.no{color:var(--negativo)}
.pill.nt{color:var(--tinta3)}
.pill.cr{color:var(--destaque)}
.pill.bf{color:var(--tinta3)}

/* ── barras: 3px, uma cor ── */
.bar{height:3px;border-radius:0;background:var(--risco2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--tinta2);transition:width .3s}
.bar.grande{height:3px}
.bar i.over{background:var(--negativo)}

/* ── botões ── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;
  padding:12px 16px;margin-top:12px;cursor:pointer;font-family:var(--sans);font-size:15px;font-weight:500;
  border-radius:8px;color:#111;background:var(--destaque);border:1px solid var(--destaque);letter-spacing:.01em}
.btn:active{opacity:.8}
.btn.sec{background:none;color:var(--tinta);border-color:var(--risco2)}
.btn.dgr{background:none;color:var(--negativo);border-color:rgba(196,87,74,.4)}
.btn.sm{min-height:40px;font-size:13.5px;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{min-height:40px;padding:9px 14px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--tinta2);
  background:none;border:1px solid var(--risco2);font-family:var(--sans);text-align:left;letter-spacing:.005em}
.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#111;font-weight:500}
.chip.mini{min-height:36px;padding:7px 12px;font-size:13.5px}
.segs{display:flex;gap:0;margin:16px 0 4px;border:1px solid var(--risco2);border-radius:8px;overflow:hidden}
.segs button{flex:1;min-height:40px;border:0;border-right:1px solid var(--risco2);background:none;
  color:var(--tinta3);font-family:var(--sans);font-size:14px;cursor:pointer}
.segs button:last-child{border-right:0}
.segs button[aria-pressed="true"]{background:var(--superficie2);color:var(--tinta);font-weight:500}

/* ── formulários ── */
.field{margin-top:20px}
.field>label{display:block;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--tinta3);margin-bottom:9px}
.field .hint{font-size:12.5px;color:var(--tinta3);margin-top:8px;line-height:1.5}
.inp{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 0 0 2px;
  border:0;border-bottom:1px solid var(--risco2);border-radius:0;background:none}
.inp:focus-within{border-bottom-color:var(--destaque);box-shadow:none}
.inp .pre{font-size:15px;color:var(--tinta3)}
.inp input,.inp select{flex:1;width:100%;min-width:0;background:none;border:0;outline:none;color:var(--tinta);
  font-family:var(--sans);font-size:16px;padding:12px 0;font-variant-numeric:tabular-nums}
.inp select{font-size:15px;-webkit-appearance:none;appearance:none}
.inp select option{background:#171718;color:var(--tinta)}
.inp.grande{min-height:62px}
.inp.grande input{font-family:var(--serif);font-size:36px;padding:10px 0;letter-spacing:-.02em}
.preview{margin-top:20px;padding:16px 0 0;border-top:1px solid var(--risco);background:none;border-radius:0}
.preview .l{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta3)}
.preview .v{font-family:var(--serif);font-size:30px;margin-top:8px;letter-spacing:-.02em}
.preview .n{font-size:12.5px;color:var(--tinta3);margin-top:8px;line-height:1.5}

/* ── conversa: sem balão de degradê ── */
.msg{display:block;margin-top:22px;max-width:100%}
.msg.eu{text-align:right}
.msg.eu .bolha{display:inline-block;max-width:84%;text-align:left;padding:11px 14px;border-radius:10px;
  background:var(--superficie2);font-size:15px;line-height:1.5;color:var(--tinta)}
.msg.or .bolha{display:block;padding:0 0 0 14px;border-left:1px solid var(--risco2);
  font-size:15.5px;line-height:1.62;color:var(--tinta2);background:none}
.msg.or .bolha b{color:var(--tinta);font-weight:600}
.msg.or .bolha .destaque{color:var(--destaque);font-weight:600;font-variant-numeric:tabular-nums}
.gr{margin-top:14px;display:flex;flex-direction:column;gap:0}
.gl{display:flex;align-items:center;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--risco)}
.gl:last-child{border-bottom:0}
.gl .n{width:92px;flex:none;color:var(--tinta2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl .b{flex:1;height:2px;background:var(--risco2);overflow:hidden}
.gl .b i{display:block;height:100%;background:var(--destaque)}
.gl .v{width:76px;flex:none;text-align:right;font-size:12.5px;color:var(--tinta);font-variant-numeric:tabular-nums}
.conta{margin-top:14px;padding:12px 14px;border-radius:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;
  font-size:12px;line-height:1.8;color:var(--tinta2);background:var(--superficie);
  border:1px solid var(--risco);white-space:pre;overflow-x:auto}
.pensando{display:inline-flex;gap:4px;padding:4px 0}
.pensando i{width:5px;height:5px;border-radius:50%;background:var(--tinta3);animation:pisca 1.3s infinite}
.pensando i:nth-child(2){animation-delay:.18s}.pensando i:nth-child(3){animation-delay:.36s}
@keyframes pisca{0%,60%,100%{opacity:.3}30%{opacity:1}}
@media(prefers-reduced-motion:reduce){.pensando i{animation:none}}

#composer{flex:none;display:none;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--risco);background:var(--fundo);z-index:5}
#composer[data-on="1"]{display:block}
.compin{display:flex;align-items:center;gap:8px}
.compin .caixa{flex:1;display:flex;align-items:center;border:1px solid var(--risco2);border-radius:8px;
  padding:0 4px 0 13px;min-height:44px}
.compin .caixa:focus-within{border-color:var(--destaque)}
.compin input{flex:1;background:none;border:0;outline:none;color:var(--tinta);font-family:var(--sans);font-size:15px;padding:11px 0}
.cbtn{width:40px;height:40px;flex:none;border-radius:8px;cursor:pointer;display:grid;place-items:center;
  font-size:15px;font-family:var(--sans);border:1px solid var(--risco2);background:none;color:var(--tinta2)}
.cbtn.env{background:var(--destaque);color:#111;border-color:var(--destaque);font-size:17px}
.cbtn.mic[data-ouvindo="1"]{background:var(--negativo);color:#fff;border-color:var(--negativo)}
.sugs{display:flex;gap:7px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.sugs::-webkit-scrollbar{display:none}
.sugs button{flex:none;padding:8px 13px;border-radius:6px;font-size:13px;cursor:pointer;background:none;
  border:1px solid var(--risco2);color:var(--tinta2);font-family:var(--sans);white-space:nowrap;min-height:36px}

/* ── navegação: só texto ── */
nav{flex:none;z-index:6;display:flex;user-select:none;padding:0 8px calc(env(safe-area-inset-bottom));
  background:var(--fundo);border-top:1px solid var(--risco)}
nav button{flex:1;min-height:54px;padding:0;background:none;border:0;cursor:pointer;position:relative;
  color:var(--tinta3);font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.02em}
nav button .g{display:none}
nav button .t{font-size:12px}
nav button:active{color:var(--tinta2)}
nav button[aria-current="page"]{color:var(--tinta)}
nav button[aria-current="page"]::before{content:'';position:absolute;top:-1px;left:14%;right:14%;
  height:1px;background:var(--destaque)}
.fab{position:absolute;right:20px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:7;
  width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;background:var(--destaque);
  color:#111;font-size:24px;line-height:1;display:grid;place-items:center;font-family:var(--sans)}
.fab:active{opacity:.8}
.fab[hidden]{display:none}

/* ── folha ── */
.backdrop{position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.7);display:none}
.backdrop[data-open="1"]{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:11;max-height:92%;display:none;flex-direction:column;
  background:var(--superficie);border-top:1px solid var(--risco2);border-radius:14px 14px 0 0;
  animation:up .22s ease}
.sheet[data-open="1"]{display:flex}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .grab{width:36px;height:3px;border-radius:3px;background:var(--risco2);margin:10px auto 2px;flex:none}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:10px 20px 14px;border-bottom:1px solid var(--risco);flex:none}
.sheet .sh h2{flex:1;margin:0;font-family:var(--serif);font-size:20px;letter-spacing:0;font-weight:400}
.sheet .sb{overflow-y:auto;overscroll-behavior:contain;padding:4px 20px calc(28px + env(safe-area-inset-bottom))}
.sheet .sb::-webkit-scrollbar{display:none}

/* ── apresentação ── */
.tour{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;background:var(--fundo)}
.tour[data-open="1"]{display:flex}
.tour .body{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:32px 28px 20px;overflow-y:auto}
.tour .mark{font-family:var(--serif);font-size:15px;color:var(--tinta3);margin-bottom:20px;font-style:italic}
.tour h2{font-family:var(--serif);font-size:34px;font-weight:400;letter-spacing:-.02em;margin:0 0 16px;line-height:1.1}
.tour p{font-size:16px;line-height:1.6;color:var(--tinta2);margin:0;max-width:330px}
.tour .foot{padding:14px 28px calc(24px + env(safe-area-inset-bottom));flex:none}
.dots{display:flex;gap:6px;margin-bottom:18px}
.dots i{width:18px;height:2px;background:var(--risco2)}
.dots i.on{background:var(--destaque)}

.toast{position:absolute;left:20px;right:20px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:30;
  padding:13px 15px;border-radius:8px;background:var(--superficie2);border:1px solid var(--risco2);
  font-size:14px;display:none;align-items:center;gap:10px}
.toast[data-open="1"]{display:flex}
.empty{padding:40px 0;text-align:left}
.empty .e{display:none}
.empty p{font-size:15px;color:var(--tinta2);margin:0;max-width:290px;line-height:1.6}
.note{font-size:12.5px;line-height:1.6;color:var(--tinta3);margin-top:26px;padding-top:14px;border-top:1px solid var(--risco)}
.gl2{margin-bottom:22px}
.gl2 b{display:block;font-size:15px;margin-bottom:6px;font-weight:600}
.gl2 p{margin:0;font-size:14.5px;color:var(--tinta2);line-height:1.6}
.dia{font-size:11px;color:var(--tinta3);letter-spacing:.09em;text-transform:uppercase;font-weight:600;margin:26px 0 0}

/* ═══ escala de tipo e espaço, base 4px ═══ */
.t-rotulo{font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--tinta3)}
.t-apoio{font-size:13px;color:var(--tinta3);line-height:1.5}
.num-xl{font-family:var(--serif);font-size:clamp(44px,14vw,58px);line-height:.95;letter-spacing:-.025em}
.num-l{font-family:var(--serif);font-size:27px;line-height:1;letter-spacing:-.02em}
.num-m{font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}

/* ═══ 1. quanto eu tenho — bloco de topo ═══ */
.topo{padding:28px 0 4px}
.topo .val{margin-top:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.topo .val .num-xl[data-negativo="1"]{color:var(--negativo)}
.topo .ctx{margin-top:12px;font-size:14px;color:var(--tinta2);line-height:1.5}
.topo .ctx b{color:var(--tinta);font-weight:600}

/* ═══ ritmo: duas barras alinhadas comparam tempo com dinheiro ═══ */
.ritmo{margin-top:24px;padding-top:18px;border-top:1px solid var(--risco)}
.ritmo .lin{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.ritmo .lin:last-of-type{margin-bottom:0}
.ritmo .lin .rot{width:76px;flex:none;font-size:12px;color:var(--tinta3)}
.ritmo .lin .trilho{flex:1;height:6px;background:var(--risco2);position:relative;border-radius:3px;overflow:hidden}
.ritmo .lin .trilho i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--tinta3)}
.ritmo .lin.gasto .trilho i{background:var(--destaque)}
.ritmo .lin.gasto.acima .trilho i{background:var(--negativo)}
.ritmo .lin .pct{width:38px;flex:none;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;color:var(--tinta2)}
.ritmo .veredito{margin-top:14px;font-size:13.5px;line-height:1.5;color:var(--tinta2)}
.ritmo .veredito b{color:var(--tinta);font-weight:600}

/* ═══ 3. algo está errado — faixa de aviso ═══ */
.alerta{display:block;width:100%;text-align:left;margin-top:22px;padding:15px 16px;border-radius:10px;
  background:var(--superficie);border:1px solid var(--risco);border-left:2px solid var(--tinta3);cursor:pointer;font-family:var(--sans)}
.alerta[data-sev="urgente"]{border-left-color:var(--negativo)}
.alerta[data-sev="atencao"]{border-left-color:var(--destaque)}
.alerta[data-sev="saudavel"]{border-left-color:var(--positivo)}
.alerta .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.alerta h3{margin:0;font-size:15px;font-weight:600;color:var(--tinta);letter-spacing:-.005em}
.alerta .seta{font-size:14px;color:var(--tinta3);flex:none}
.alerta p{margin:6px 0 0;font-size:13.5px;line-height:1.55;color:var(--tinta2)}
.alerta p b{color:var(--tinta);font-weight:600}

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════
   GRIMÓRIO — assistente financeiro
   Registro manual · vários perfis · Oráculo conversacional
   Tudo roda no aparelho. Nenhum dado sai daqui.
   ═══════════════════════════════════════════════════════════ */

const guardar=(k,v)=>{try{localStorage.setItem('gr.'+k,JSON.stringify(v))}catch(e){}};
const buscar=(k,p)=>{try{const v=localStorage.getItem('gr.'+k);return v?JSON.parse(v):p}catch(e){return p}};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);

/* ═════════ PERFIS ═════════ */
let PERFIS=buscar('perfis',null);
let perfilAtivo=buscar('perfilAtivo',null);
const inicial=n=>(n||'?').trim().slice(0,2).toUpperCase();

if(!PERFIS||!PERFIS.length){
  PERFIS=[{id:uid(),nome:'Eu'}];
  perfilAtivo=PERFIS[0].id;
  guardar('perfis',PERFIS);guardar('perfilAtivo',perfilAtivo);
}
if(!PERFIS.some(p=>p.id===perfilAtivo))perfilAtivo=PERFIS[0].id;
const perfil=()=>PERFIS.find(p=>p.id===perfilAtivo);

/* ═════════ MODELO ═════════ */
const CAT_PADRAO=[
  {n:'Moradia',e:true},{n:'Mercado',e:true},{n:'Transporte',e:true},
  {n:'Saúde',e:true},{n:'Contas de casa',e:true},{n:'Educação',e:true},
  {n:'Restaurantes',e:false},{n:'Assinaturas',e:false},{n:'Lazer',e:false},
  {n:'Roupas',e:false},{n:'Presentes',e:false},{n:'Pets',e:false},
];
const CAT_ENTRADA=['Salário','Vale refeição','Freelance','Rendimentos','Reembolso','Venda','13º e férias','Presente recebido'];
const CLASSES=['Renda fixa pós-fixada','Renda fixa prefixada','Protegido da inflação','Renda fixa isenta de IR',
  'Ações do Brasil','Fundos imobiliários','Investimento internacional','Criptoativos','Previdência privada','Fundos multimercado'];

const vazio=()=>({contas:[],investimentos:[],dividas:[],cartoes:[{id:uid(),nome:'Cartão de crédito',fechamento:28,vencimento:8}],
  lancamentos:[],recorrentes:[],orcamento:{},aporteMeta:0,metas:[],chat:[],
  categorias:CAT_PADRAO.map(c=>({...c})),config:{cdi:.139,ipca:.0444,selic:.14}});

let DB=buscar('db.'+perfilAtivo,null)||vazio();
const persistir=()=>guardar('db.'+perfilAtivo,DB);
function trocarPerfil(id){
  persistir();perfilAtivo=id;guardar('perfilAtivo',id);
  DB=buscar('db.'+id,null)||vazio();mesVisto=mesAtual();tela='inicio';fecharFolha();atualizar();
}

/* ═════════ FORMATOS ═════════ */
let ocultar=buscar('ocultar',false);
const _brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const R$=n=>ocultar?'R$ ••••':_brl(n);
const pc=(n,d=0)=>((n||0)*100).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const soma=a=>a.reduce((s,x)=>s+(x||0),0);
const aoMes=a=>Math.pow(1+a,1/12)-1;
const aoDia=a=>Math.pow(1+a,1/365)-1;
const irDe=d=>d<=180?.225:d<=360?.20:d<=720?.175:.15;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hojeISO=()=>new Date().toISOString().slice(0,10);
const mesDe=i=>String(i).slice(0,7);
const mesAtual=()=>hojeISO().slice(0,7);
const nomeMes=m=>{const[a,b]=m.split('-');return new Date(a,b-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
const diasNoMes=m=>{const[a,b]=m.split('-').map(Number);return new Date(a,b,0).getDate()};
const catDe=n=>DB.categorias.find(c=>c.n===n)||{n,e:false};
let mesVisto=mesAtual();

/* ═════════ CÉREBRO: ENTENDER ═════════ */
const sa=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const NUM_ESC={um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,
  quinze:15,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90,cem:100,mil:1000};

function extrairValor(txt){
  const t=sa(txt);let m;
  if(m=t.match(/(?:r\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?)/))return parseFloat(m[1].replace(/\./g,'').replace(',','.'));
  if(m=t.match(/(?:r\$\s*)?(\d+,\d{1,2})/))return parseFloat(m[1].replace(',','.'));
  if(m=t.match(/(\d+(?:[.,]\d+)?)\s*(mil|k)\b/))return parseFloat(m[1].replace(',','.'))*1000;
  if(m=t.match(/(?:r\$\s*)?(?<!dia\s)(\d+)(?!\s*(?:%|dias?|meses|anos|x))/))return parseFloat(m[1]);
  for(const[p,v]of Object.entries(NUM_ESC))if(new RegExp(`\\b${p}\\b`).test(t))return v;
  return null;
}
const MESES=['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function extrairPeriodo(txt){
  const t=sa(txt);
  const desloca=n=>{const[a,m]=mesAtual().split('-').map(Number);return new Date(a,m-1-n,1).toISOString().slice(0,7)};
  if(/mes passado|mes anterior|ultimo mes/.test(t))return{meses:[desloca(1)],rotulo:'no mês passado'};
  if(/retrasado/.test(t))return{meses:[desloca(2)],rotulo:'dois meses atrás'};
  let m;
  if(m=t.match(/ultimos? (\d+) meses/)){const n=Math.min(12,+m[1]);
    return{meses:Array.from({length:n},(_,i)=>desloca(i)),rotulo:`nos últimos ${n} meses`}}
  if(/(esse|este|nesse|neste) ano|no ano/.test(t)){const a=mesAtual().slice(0,4);
    return{meses:Array.from({length:12},(_,i)=>`${a}-${String(i+1).padStart(2,'0')}`),rotulo:'neste ano'}}
  if(/\bhoje\b/.test(t))return{meses:[mesAtual()],dia:hojeISO(),rotulo:'hoje'};
  if(/\bontem\b/.test(t)){const d=new Date();d.setDate(d.getDate()-1);
    return{meses:[mesDe(d.toISOString())],dia:d.toISOString().slice(0,10),rotulo:'ontem'}}
  if(/(essa|esta|nessa) semana/.test(t))return{meses:[mesAtual()],semana:true,rotulo:'nesta semana'};
  for(let i=0;i<12;i++)if(new RegExp(`\\b${MESES[i]}\\b`).test(t)){
    const a=mesAtual().slice(0,4);return{meses:[`${a}-${String(i+1).padStart(2,'0')}`],rotulo:`em ${MESES[i]}`}}
  return{meses:[mesVisto],rotulo:mesVisto===mesAtual()?'neste mês':'em '+nomeMes(mesVisto),padrao:true};
}
function perto(a,b){
  a=sa(a);b=sa(b);
  if(a===b)return 0;
  if(a.length<3||b.length<3)return 9;
  if(b.includes(a)||a.includes(b))return 1;
  const d=Array.from({length:a.length+1},(_,i)=>[i,...Array(b.length).fill(0)]);
  for(let j=0;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
const SINONIMOS={
  'Mercado':['mercado','supermercado','compras','feira','hortifruti','acougue','padaria','atacadao','carrefour','assai'],
  'Restaurantes':['restaurante','ifood','delivery','lanche','almoco','janta','jantar','pizza','hamburguer','cafe','cerveja','rappi','comida','padoca'],
  'Transporte':['uber','99','gasolina','combustivel','posto','onibus','metro','estacionamento','pedagio','corrida','passagem','carro'],
  'Moradia':['aluguel','condominio','iptu','financiamento','casa','apartamento','reforma'],
  'Contas de casa':['luz','energia','agua','gas','internet','telefone','celular','wifi','conta de luz'],
  'Saúde':['farmacia','remedio','medico','dentista','consulta','exame','plano de saude','hospital','psicologo','terapia'],
  'Educação':['curso','faculdade','escola','livro','mensalidade','ingles','aula'],
  'Assinaturas':['assinatura','netflix','spotify','disney','prime','hbo','max','youtube','streaming','icloud','google one'],
  'Lazer':['cinema','show','ingresso','bar','viagem','hotel','passeio','academia','jogo','festa','role'],
  'Roupas':['roupa','tenis','sapato','camisa','calca','vestido','shopping','shein','renner','zara'],
  'Presentes':['presente','aniversario','natal','flores'],
  'Pets':['pet','racao','veterinario','petshop','cachorro','gato'],
};
const SIN_ENTRADA={
  'Salário':['salario','pagamento','holerite','contracheque','emprego'],
  'Vale refeição':['vale refeicao','vr','vale alimentacao','va','ticket','sodexo','alelo','caju','flash','beneficio'],
  'Freelance':['freela','freelance','bico','projeto','servico','job'],
  'Rendimentos':['rendimento','juros','dividendo','rendeu'],
  'Reembolso':['reembolso','estorno','devolucao','devolveram'],
  'Venda':['vendi','venda','vendeu'],
  '13º e férias':['decimo','ferias','bonus','plr'],
  'Presente recebido':['presente','me deram'],
};
function extrairCategoria(txt){
  const t=sa(txt),palavras=t.split(/[\s,.!?]+/).filter(p=>p.length>2);
  for(const[cat,lista]of Object.entries(SINONIMOS)){
    if(!DB.categorias.some(c=>c.n===cat))continue;
    for(const s of lista)if(new RegExp(`\\b${s}\\b`).test(t))return cat;
  }
  let melhor=null,melhorD=3;
  for(const c of DB.categorias){
    const lim=Math.max(1,Math.floor(sa(c.n).length/5));
    for(const p of palavras){
      if(p.length<4)continue;
      if(Math.abs(p.length-sa(c.n).length)>3)continue;
      const d=perto(p,c.n);
      if(d<=lim&&d<melhorD){melhorD=d;melhor=c.n}
    }
  }
  return melhor;
}
function extrairCategoriaEntrada(txt){
  const t=sa(txt);
  for(const[cat,lista]of Object.entries(SIN_ENTRADA))
    for(const s of lista)if(new RegExp(`\\b${s}\\b`).test(t))return cat;
  return null;
}
const MEIOS=[
  [/\bcredito|cartao|no credito|parcelad/,'credito'],
  [/\bdebito|pix|transferenci/,'debito'],
  [/\bdinheiro|especie/,'dinheiro'],
  [/\bvale|vr\b|va\b|refeicao|alimentacao|ticket|sodexo|alelo|caju|flash/,'beneficio'],
];
const REGRAS=[
  {id:'registrar_saida',p:[[/\b(gastei|paguei|comprei|torrei|gastou|saiu)\b/,4],[/\bgasto de\b/,3]]},
  {id:'registrar_entrada',p:[[/\b(recebi|ganhei|caiu|entrou|depositaram|me pagaram)\b/,4]]},
  {id:'registrar_aporte',p:[[/\b(investi|apliquei|aportei|guardei|poupei)\b/,4]]},
  {id:'quanto_gastei',p:[[/quanto.{0,12}(gastei|gasto|saiu|torrei)/,4],[/(total|soma).{0,10}gast/,3],[/gastei quanto/,4]]},
  {id:'onde_gastei',p:[[/(onde|no que|em que|com o que|pra onde).{0,20}(gast|dinheiro|foi|vai|ta indo|esta indo)/,4],[/maior(es)? gasto/,4],[/o que mais (gasto|pesa|consome)/,4],[/resumo/,2]]},
  {id:'posso_gastar',p:[[/(posso|consigo|da pra|devo|cabe).{0,20}(gastar|comprar|pagar|torrar|investir|parcelar)/,4],[/(vale a pena|compensa).{0,12}comprar/,3],[/quero comprar/,3]]},
  {id:'sobra',p:[[/quanto.{0,15}(sobrou|sobra|resta|restou|posso usar|tenho pra gastar)/,4],[/(saldo|dinheiro).{0,6}(do mes|disponivel|livre)/,3]]},
  {id:'patrimonio',p:[[/quanto (eu )?tenho(?!.{0,10}pra gastar)/,4],[/patrimonio|total que tenho/,4]]},
  {id:'comparar',p:[[/(mais|menos|melhor|pior).{0,15}(que|do que).{0,18}(mes passado|antes|mes anterior|normal|media|costume)/,4],[/compar/,3],[/(gastei|foi) mais/,3]]},
  {id:'previsao',p:[[/(como|vou|vai).{0,20}(fechar|terminar|acabar)/,4],[/projec|previsao|estimativa|vai sobrar|no ritmo/,4]]},
  {id:'orcamento',p:[[/(dentro|fora|estourei|passei).{0,15}(do )?(plano|orcamento|limite)/,4],[/meu (plano|orcamento)/,3],[/como (esta|ta) o plano/,4]]},
  {id:'assinaturas',p:[[/assinatura|streaming|mensalidade/,4],[/recorrente|gasto fixo|fixos/,3]]},
  {id:'reserva',p:[[/reserva|emergencia|colchao/,4]]},
  {id:'divida',p:[[/divida|fatura|emprestimo|rotativo|parcelamento|devo quanto/,4]]},
  {id:'parado',p:[[/parad|render|rendimento|aplicar|investir onde|onde po(r|nho)|dinheiro sobrando/,4]]},
  {id:'meta',p:[[/meta|objetivo|juntar|quando (eu )?consigo|falta quanto/,4]]},
  {id:'credito_plano',p:[[/(vale|compensa).{0,20}(cartao|credito)/,4],[/pagar tudo no (cartao|credito)/,4],[/float|flutuacao/,3]]},
  {id:'renda',p:[[/quanto (eu )?(ganho|recebo|entra)/,4],[/minha renda|meu salario/,4]]},
  {id:'ajuda',p:[[/^(oi|ola|opa|e ai|bom dia|boa tarde|boa noite|hey)\b/,4],[/(o que|oq) (voce|vc) (faz|sabe|pode)/,4],[/\bajuda\b|como funciona|me ensina/,3]]},
];
let ctxChat={ultimaIntencao:null,ultimaCategoria:null};

function entender(txt){
  const t=sa(txt),valor=extrairValor(txt);
  const ehPergunta=/\b(quanto|quando|onde|como|qual|quais|porque|sera|posso|consigo|da pra|vale a pena|compensa|tenho|estou|to)\b|\?/.test(t);
  const notas=REGRAS.map(r=>{
    let s=0;for(const[re,peso]of r.p)if(re.test(t))s+=peso;
    if(r.id.startsWith('registrar')){if(valor===null)s=0;else if(ehPergunta)s-=3}
    return{id:r.id,score:s};
  }).sort((a,b)=>b.score-a.score);
  let melhor=notas[0].score>0?notas[0]:{id:'desconhecido',score:0};
  const meio=(MEIOS.find(([re])=>re.test(t))||[])[1]||null;
  let categoria=melhor.id==='registrar_entrada'?extrairCategoriaEntrada(txt):extrairCategoria(txt);
  if(melhor.score===0&&ctxChat.ultimaIntencao&&/^(e |mas |que tal )?(o |no |na )?(mes passado|ontem|hoje|esse ano|semana|mercado|restaurante)/.test(t))
    melhor={id:ctxChat.ultimaIntencao,score:2,herdado:true};
  if(melhor.id==='desconhecido'&&valor&&categoria&&!ehPergunta)melhor={id:'registrar_saida',score:2};
  if(!categoria&&ctxChat.ultimaCategoria&&/\be (nele|nela|nisso|nesse|nessa)\b|^e (o|a) /.test(t))categoria=ctxChat.ultimaCategoria;
  return{intencao:melhor.id,confianca:Math.min(1,melhor.score/4),valor,meio,categoria,ehPergunta,periodo:extrairPeriodo(txt),texto:txt};
}

/* ═════════ CÁLCULOS ═════════ */
let T={};
function lancDe(meses,dia,semana){
  let l=DB.lancamentos.filter(x=>meses.includes(mesDe(x.data)));
  if(dia)l=l.filter(x=>x.data===dia);
  if(semana){const d=new Date();d.setDate(d.getDate()-7);const lim=d.toISOString().slice(0,10);l=l.filter(x=>x.data>=lim)}
  return l;
}
function calcular(){
  const m=mesVisto,lanc=DB.lancamentos.filter(l=>mesDe(l.data)===m);
  T.mes=m;T.lanc=lanc;
  T.entradas=soma(lanc.filter(l=>l.tipo==='entrada'&&l.cat!=='Vale refeição').map(l=>l.valor));
  T.beneficioIn=soma(lanc.filter(l=>l.tipo==='entrada'&&l.cat==='Vale refeição').map(l=>l.valor));
  T.saidas=soma(lanc.filter(l=>l.tipo==='saida'&&l.meio!=='beneficio').map(l=>l.valor));
  T.beneficioOut=soma(lanc.filter(l=>l.tipo==='saida'&&l.meio==='beneficio').map(l=>l.valor));
  T.beneficio=T.beneficioIn-T.beneficioOut;
  T.aportes=soma(lanc.filter(l=>l.tipo==='aporte').map(l=>l.valor));
  T.sobra=T.entradas-T.saidas-T.aportes;

  const porCat=new Map();
  lanc.filter(l=>l.tipo==='saida').forEach(l=>porCat.set(l.cat,(porCat.get(l.cat)||0)+l.valor));
  T.categorias=DB.categorias.map(c=>({...c,gasto:porCat.get(c.n)||0,plano:DB.orcamento[c.n]||0}))
    .filter(c=>c.gasto>0||c.plano>0).sort((a,b)=>b.gasto-a.gasto);
  porCat.forEach((v,k)=>{if(!T.categorias.some(c=>c.n===k))T.categorias.push({n:k,e:false,g:'◇',gasto:v,plano:0})});
  T.gastoTotal=T.saidas+T.beneficioOut;
  T.planoTotal=soma(Object.values(DB.orcamento));
  T.essenciais=soma(T.categorias.filter(c=>c.e).map(c=>c.gasto));
  T.desejos=T.gastoTotal-T.essenciais;

  const ehAtual=m===mesAtual();
  T.ehAtual=ehAtual;
  T.diaHoje=ehAtual?new Date().getDate():diasNoMes(m);
  T.diasMes=diasNoMes(m);
  T.diasRestantes=Math.max(0,T.diasMes-T.diaHoje);
  T.projecao=ehAtual&&T.diaHoje>2?T.saidas/T.diaHoje*T.diasMes:T.saidas;
  T.restanteOrc=T.planoTotal-T.saidas;
  T.porDia=ehAtual&&T.diasRestantes>0?Math.max(0,T.restanteOrc)/T.diasRestantes:0;

  T.noCredito=soma(lanc.filter(l=>l.tipo==='saida'&&l.meio==='credito').map(l=>l.valor));
  T.fatiaCredito=T.saidas>0?T.noCredito/T.saidas:0;
  T.faturaAberta=soma(DB.lancamentos.filter(l=>l.meio==='credito'&&!l.pago).map(l=>l.valor));

  T.emConta=soma(DB.contas.map(c=>c.saldo));
  T.parado=soma(DB.contas.filter(c=>!c.rende).map(c=>c.saldo));
  T.invest=soma(DB.investimentos.map(i=>i.valor));
  T.divida=soma(DB.dividas.map(d=>d.saldo));
  T.bruto=T.emConta+T.invest;
  T.liquido=T.bruto-T.divida-T.faturaAberta;
  T.liquidez=soma(DB.contas.filter(c=>c.rende).map(c=>c.saldo))+soma(DB.investimentos.filter(i=>i.liquido).map(i=>i.valor));
  T.mesesReserva=T.essenciais>0?T.liquidez/T.essenciais:0;

  T.historico=[];
  for(let i=5;i>=0;i--){
    const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);
    const mm=d.toISOString().slice(0,7),ls=DB.lancamentos.filter(l=>mesDe(l.data)===mm);
    T.historico.push({m:mm,saidas:soma(ls.filter(l=>l.tipo==='saida').map(l=>l.valor)),
      entradas:soma(ls.filter(l=>l.tipo==='entrada').map(l=>l.valor)),
      curto:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')});
  }
  const h=T.historico.slice(0,5).filter(x=>x.saidas>0&&x.m!==m).slice(-3);
  T.media3=h.length?soma(h.map(x=>x.saidas))/h.length:0;

  // recorrentes ainda não lançados neste mês
  T.pendentes=DB.recorrentes.filter(r=>r.ativo!==false&&
    !DB.lancamentos.some(l=>l.recId===r.id&&mesDe(l.data)===m));
  T.aVir=soma(T.pendentes.filter(r=>r.tipo==='entrada').map(r=>r.valor))
        -soma(T.pendentes.filter(r=>r.tipo!=='entrada').map(r=>r.valor));

  T.vazio=DB.lancamentos.length===0;
  LEITURAS=leituras();
}

/* ═════════ CÉREBRO: LEITURAS PROATIVAS ═════════ */
let LEITURAS=[];
function leituras(){
  const o=[],cdiM=aoMes(DB.config.cdi);
  if(T.vazio)return o;
  if(T.planoTotal>0&&T.ehAtual&&T.diaHoje>2){
    const acima=T.projecao>T.planoTotal;
    o.push({id:'ritmo',sev:acima?'atencao':'saudavel',t:acima?'Você está gastando rápido demais':'Seu ritmo cabe no plano',
      txt:acima?`No dia ${T.diaHoje} você já gastou <b>${R$(T.saidas)}</b>. Nesse ritmo o mês fecha em ${R$(T.projecao)}, ${R$(T.projecao-T.planoTotal)} acima do plano.`
               :`No dia ${T.diaHoje} você gastou ${R$(T.saidas)} e deve fechar perto de <b>${R$(T.projecao)}</b>, dentro do plano.`});
  }
  const est=T.categorias.filter(c=>c.plano>0&&c.gasto>c.plano);
  if(est.length)o.push({id:'estouro',sev:'atencao',t:`${est[0].n} passou do planejado`,
    txt:`Planejou ${R$(est[0].plano)} e gastou <b>${R$(est[0].gasto)}</b>.`});
  if(DB.dividas.length){
    const c=[...DB.dividas].sort((a,b)=>b.taxa-a.taxa)[0];
    if(c.taxa>cdiM)o.push({id:'divida',sev:'urgente',t:'Sua dívida cresce mais que seu investimento',
      txt:`${c.nome} cobra <b>${pc(c.taxa,1)} ao mês</b>. Sua melhor aplicação rende ${pc(cdiM,2)}.`});
  }
  if(T.faturaAberta>T.liquidez&&T.faturaAberta>0)o.push({id:'fatura',sev:'urgente',t:'A fatura não está coberta',
    txt:`Fatura de <b>${R$(T.faturaAberta)}</b> contra ${R$(T.liquidez)} disponíveis.`});
  if(T.parado>T.essenciais*.3){const oc=T.parado-T.essenciais*.3;
    o.push({id:'parado',sev:'atencao',t:'Dinheiro parado na conta',txt:`${R$(oc)} sem render — ${R$(oc*cdiM)} por mês deixados na mesa.`})}
  if(T.pendentes.length)o.push({id:'pendentes',sev:'atencao',t:`${T.pendentes.length} lançamento(s) fixo(s) pendente(s)`,
    txt:'Você marcou como recorrentes mas ainda não lançou neste mês.'});
  if(T.essenciais>0)o.push({id:'reserva',sev:T.mesesReserva>=6?'saudavel':T.mesesReserva<3?'urgente':'atencao',
    t:'Sua reserva de emergência',txt:`Cobre <b>${T.mesesReserva.toFixed(1)} meses</b> das suas contas obrigatórias.`});
  const ordem={urgente:0,atencao:1,contexto:2,saudavel:3};
  return o.sort((a,b)=>ordem[a.sev]-ordem[b.sev]);
}

/* ═════════ CÉREBRO: RACIOCINAR E RESPONDER ═════════ */
const grafico=itens=>{const mx=Math.max(...itens.map(i=>i.v))||1;
  return `<div class="gr">${itens.map(i=>`<div class="gl"><span class="n">${esc(i.n)}</span>
    <span class="b"><i style="width:${Math.max(3,i.v/mx*100)}%"></i></span>
    <span class="v">${R$(i.v)}</span></div>`).join('')}</div>`};
const D=v=>`<span class="destaque">${R$(v)}</span>`;

function somaPeriodo(p,cat){
  let l=lancDe(p.meses,p.dia,p.semana).filter(x=>x.tipo==='saida');
  if(cat)l=l.filter(x=>x.cat===cat);
  return {total:soma(l.map(x=>x.valor)),lanc:l};
}

function responder(q){
  const cdiM=aoMes(DB.config.cdi),cdiD=aoDia(DB.config.cdi);
  const cat=q.categoria,p=q.periodo;
  ctxChat.ultimaIntencao=q.intencao;
  if(cat)ctxChat.ultimaCategoria=cat;

  const semDados=()=>({html:'Ainda não tenho lançamentos suficientes para responder isso. Registre alguns gastos primeiro — pode ser aqui mesmo, é só dizer algo como <b>"gastei 40 no mercado"</b>.',chips:['gastei 40 no mercado','o que você faz?']});

  switch(q.intencao){

  case 'registrar_saida': case 'registrar_entrada': case 'registrar_aporte': {
    const tipo=q.intencao.split('_')[1];
    const categoria=q.categoria||(tipo==='aporte'?'Aporte':tipo==='entrada'?'Outra entrada':null);
    if(!categoria)return{html:`Entendi <b>${R$(q.valor)}</b>, mas não peguei a categoria. Em que foi?`,
      chips:DB.categorias.slice(0,6).map(c=>`${q.texto} em ${c.n.toLowerCase()}`)};
    const l={id:uid(),data:p.dia||hojeISO(),tipo,valor:q.valor,cat:categoria,
      meio:q.meio||(tipo==='saida'?'debito':'pix'),desc:'',pago:q.meio!=='credito'};
    DB.lancamentos.push(l);persistir();calcular();
    const c=T.categorias.find(x=>x.n===categoria);
    let extra='';
    if(tipo==='saida'&&c&&c.plano>0){
      const rest=c.plano-c.gasto;
      extra=rest>=0?` Em ${categoria} você já usou ${R$(c.gasto)} dos ${R$(c.plano)} do mês — restam ${D(rest)}.`
                   :` Com isso ${categoria} passou o plano em ${D(-rest)}.`;
    }else if(tipo==='saida'){
      extra=` Total de ${categoria} neste mês: ${D(c?c.gasto:q.valor)}.`;
    }else if(tipo==='aporte'&&DB.aporteMeta>0){
      extra=` Você já investiu ${R$(T.aportes)} dos ${R$(DB.aporteMeta)} planejados.`;
    }
    return{html:`Anotado: <b>${_brl(q.valor)}</b> em ${categoria}${q.meio==='credito'?', no crédito':''}.${extra}`,
      desfazer:l.id,chips:['quanto gastei esse mês?','onde meu dinheiro tá indo?']};
  }

  case 'quanto_gastei': {
    const {total,lanc}=somaPeriodo(p,cat);
    if(!lanc.length)return{html:`Não achei nenhum gasto${cat?` em ${cat}`:''} ${p.rotulo}.`,chips:['quanto gastei mês passado','onde meu dinheiro tá indo?']};
    const dias=p.meses.length*30;
    let html=`${cat?`Em <b>${cat}</b>`:'Você gastou'} ${p.rotulo}: ${D(total)} em ${lanc.length} lançamento${lanc.length>1?'s':''}.`;
    // comparação com o período anterior equivalente
    if(p.meses.length===1&&!p.dia&&!p.semana){
      const [a,mm]=p.meses[0].split('-').map(Number);
      const ant=new Date(a,mm-2,1).toISOString().slice(0,7);
      const {total:tAnt}=somaPeriodo({meses:[ant]},cat);
      if(tAnt>0){const d=(total-tAnt)/tAnt;
        html+=` Isso é <b>${pc(Math.abs(d))} ${d>0?'a mais':'a menos'}</b> que no mês anterior, que fechou em ${R$(tAnt)}.`}
    }
    if(!cat){
      const porC=new Map();lanc.forEach(l=>porC.set(l.cat,(porC.get(l.cat)||0)+l.valor));
      html+=grafico([...porC.entries()].map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v).slice(0,6));
    }else{
      const maiores=[...lanc].sort((a,b)=>b.valor-a.valor).slice(0,4);
      html+=grafico(maiores.map(l=>({n:l.desc||l.data.slice(8)+'/'+l.data.slice(5,7),v:l.valor})));
      html+=`<div class="conta">Média por lançamento  ${_brl(total/lanc.length)}\nMaior gasto           ${_brl(maiores[0].valor)}\nMédia por dia         ${_brl(total/dias)}</div>`;
    }
    return{html,chips:cat?['e mês passado?','onde meu dinheiro tá indo?']:['no que eu mais gasto','como vou fechar o mês?']};
  }

  case 'onde_gastei': {
    if(!T.categorias.length)return semDados();
    const total=T.gastoTotal;
    const top=T.categorias.slice(0,3);
    let html=`${p.rotulo==='neste mês'?'Neste mês':p.rotulo} saíram ${D(total)}. As três maiores:<br><b>${top.map(c=>`${c.n} ${pc(c.gasto/total)}`).join(' · ')}</b>`;
    html+=grafico(T.categorias.slice(0,7).map(c=>({n:c.n,v:c.gasto})));
    const obr=T.essenciais/total,esc_=T.desejos/total;
    html+=`<div class="conta">Contas obrigatórias  ${pc(obr).padStart(5)}  ${_brl(T.essenciais)}\nEscolhas suas        ${pc(esc_).padStart(5)}  ${_brl(T.desejos)}</div>`;
    html+=`<br>Das suas escolhas, <b>${top.filter(c=>!c.e).map(c=>c.n).join(' e ')||'nenhuma'}</b> é o que mais pesa.`;
    return{html,chips:['quanto gastei em restaurantes','gastei mais que mês passado?','tô dentro do plano?']};
  }

  case 'posso_gastar': {
    if(!q.valor)return{html:'Gastar quanto? Me diz o valor que eu faço as contas.',chips:['posso gastar 300?','posso gastar 1000?']};
    const v=q.valor;
    const c=cat?T.categorias.find(x=>x.n===cat):null;
    const sobraProj=T.entradas-T.projecao-T.aportes;
    const linhas=[];
    let veredito,cor;

    if(c&&c.plano>0){
      const rest=c.plano-c.gasto;
      linhas.push(`Plano de ${c.n}      ${_brl(c.plano)}`);
      linhas.push(`Já gasto             ${_brl(c.gasto)}`);
      linhas.push(`Disponível           ${_brl(rest)}`);
      if(v<=rest)veredito=`Cabe. Sobram ${D(rest-v)} em ${c.n} depois dessa compra.`;
      else veredito=`Não cabe no plano de ${c.n}: passaria ${D(v-rest)} do limite. Ainda dá, mas sai de outro lugar.`;
    }
    linhas.push(`Renda do mês         ${_brl(T.entradas)}`);
    linhas.push(`Projeção de gastos   ${_brl(T.projecao)}`);
    linhas.push(`Sobra prevista       ${_brl(sobraProj)}`);
    linhas.push(`Essa compra          ${_brl(v)}`);
    linhas.push(`Sobra depois dela    ${_brl(sobraProj-v)}`);

    if(!veredito){
      if(v<=sobraProj*.5)veredito=`Cabe com folga. Ainda sobrariam ${D(sobraProj-v)} no mês.`;
      else if(v<=sobraProj)veredito=`Cabe, mas aperta: sobrariam só ${D(sobraProj-v)}.`;
      else veredito=`Não cabe na sobra deste mês. Faltariam ${D(v-sobraProj)}, que sairiam do que você já tem guardado.`;
    }
    let html=`<b>${veredito}</b><div class="conta">${linhas.join('\n')}</div>`;
    // o outro lado da moeda, sempre
    const em1ano=v*Math.pow(1+cdiM,12)-v;
    html+=`<br>Para você decidir com tudo à vista: esses ${R$(v)} rendendo a 100% do CDI virariam ${R$(v+em1ano)} em um ano. `;
    if(T.mesesReserva<6)html+=`E sua reserva hoje cobre ${T.mesesReserva.toFixed(1)} meses, abaixo dos 6 de referência.`;
    else html+=`Sua reserva segue coberta, com ${T.mesesReserva.toFixed(1)} meses.`;
    return{html,chips:['quanto sobrou?','minha reserva tá boa?','como vou fechar o mês?']};
  }

  case 'sobra': {
    if(T.vazio)return semDados();
    let html=`Entraram ${R$(T.entradas)} e saíram ${R$(T.saidas)}${T.aportes>0?`, mais ${R$(T.aportes)} que você investiu`:''}. Sobra atual: ${D(T.sobra)}.`;
    if(T.pendentes.length)html+=`<br><br>Mas ainda faltam lançar ${T.pendentes.length} fixo(s) deste mês${T.aVir!==0?`, o que muda a sobra em ${R$(T.aVir)}`:''}.`;
    if(T.ehAtual&&T.diasRestantes>0)html+=`<br><br>Faltam ${T.diasRestantes} dias. No seu ritmo, o mês deve fechar com ${D(T.entradas-T.projecao-T.aportes)}.`;
    if(T.beneficio>0)html+=`<br><br>Fora isso, você tem ${R$(T.beneficio)} de vale refeição, que só serve para comida.`;
    return{html,chips:['como vou fechar o mês?','onde meu dinheiro tá indo?']};
  }

  case 'previsao': {
    if(!T.ehAtual||T.diaHoje<3)return{html:'Ainda é cedo no mês para uma projeção confiável. Depois de alguns dias de lançamentos eu consigo estimar.',chips:['quanto gastei esse mês?']};
    const fecha=T.projecao,sobraFim=T.entradas-fecha-T.aportes;
    let html=`No dia ${T.diaHoje} você gastou ${R$(T.saidas)}, uma média de ${R$(T.saidas/T.diaHoje)} por dia. Mantendo o ritmo, o mês fecha em ${D(fecha)}.`;
    html+=`<div class="conta">Gasto até hoje      ${_brl(T.saidas)}\nMédia por dia       ${_brl(T.saidas/T.diaHoje)}\n× ${T.diasMes} dias            ${_brl(fecha)}\nRenda do mês        ${_brl(T.entradas)}\nSobra projetada     ${_brl(sobraFim)}</div>`;
    if(T.planoTotal>0){
      const dif=fecha-T.planoTotal;
      html+=`<br>Seu plano é de ${R$(T.planoTotal)}. ${dif>0?`A projeção passa dele em <b>${R$(dif)}</b>. Para fechar dentro, o gasto teria que cair para ${D(Math.max(0,T.restanteOrc)/Math.max(1,T.diasRestantes))} por dia nos ${T.diasRestantes} dias que faltam.`:`A projeção fica <b>${R$(-dif)}</b> abaixo dele.`}`;
    }
    return{html,chips:['tô dentro do plano?','onde meu dinheiro tá indo?']};
  }

  case 'orcamento': {
    if(!T.planoTotal)return{html:'Você ainda não definiu um plano de gastos. Dá para montar na aba <b>Plano</b> — é lá que você diz quanto pretende gastar em cada categoria.',chips:['onde meu dinheiro tá indo?']};
    const est=T.categorias.filter(c=>c.plano>0&&c.gasto>c.plano);
    const ok=T.categorias.filter(c=>c.plano>0&&c.gasto<=c.plano);
    let html=`Você planejou ${R$(T.planoTotal)} e gastou ${D(T.saidas)}. `;
    html+=T.restanteOrc>=0?`Restam ${R$(T.restanteOrc)}${T.diasRestantes>0?`, ou ${R$(T.porDia)} por dia até o fim do mês.`:'.'}`
                          :`Você passou ${R$(-T.restanteOrc)} do plano.`;
    if(est.length)html+=`<br><br>Estouraram: <b>${est.map(c=>c.n).join(', ')}</b>.`+grafico(est.map(c=>({n:c.n,v:c.gasto})));
    else html+=`<br><br>Nenhuma categoria estourou. ${ok.length} dentro do limite.`;
    return{html,chips:['como vou fechar o mês?','no que eu mais gasto']};
  }

  case 'comparar': {
    if(!T.media3)return{html:'Ainda não tenho meses anteriores suficientes para comparar. Depois de dois ou três meses de registro isso fica bom.',chips:['quanto gastei esse mês?']};
    const d=(T.saidas-T.media3)/T.media3;
    let html=`Neste mês você gastou ${D(T.saidas)}. Sua média dos 3 meses anteriores é ${R$(T.media3)} — <b>${pc(Math.abs(d))} ${d>0?'a mais':'a menos'}</b>.`;
    html+=grafico(T.historico.map(h=>({n:h.curto,v:h.saidas})));
    // qual categoria mudou mais
    const antes=new Map();
    T.historico.slice(0,-1).forEach(h=>{
      DB.lancamentos.filter(l=>mesDe(l.data)===h.m&&l.tipo==='saida')
        .forEach(l=>antes.set(l.cat,(antes.get(l.cat)||0)+l.valor/Math.max(1,T.historico.length-1)));
    });
    const varia=T.categorias.map(c=>({n:c.n,dif:c.gasto-(antes.get(c.n)||0)})).sort((a,b)=>b.dif-a.dif);
    if(varia.length&&Math.abs(varia[0].dif)>20)
      html+=`<br>A maior diferença veio de <b>${varia[0].n}</b>: ${varia[0].dif>0?'+':''}${R$(varia[0].dif)} contra a média.`;
    return{html,chips:['no que eu mais gasto','como vou fechar o mês?']};
  }

  case 'patrimonio': {
    if(!T.bruto)return{html:'Você ainda não registrou seus saldos. Dá para fazer isso em <b>Início → Seu dinheiro</b>, informando quanto tem em cada conta e investimento.',chips:['o que você faz?']};
    let html=`Somando tudo e tirando o que você deve: ${D(T.liquido)}.`;
    html+=grafico([{n:'Em conta',v:T.emConta},{n:'Investido',v:T.invest},
      ...(T.divida?[{n:'Dívidas',v:T.divida}]:[]),...(T.faturaAberta?[{n:'Fatura',v:T.faturaAberta}]:[])]);
    if(T.parado>0)html+=`<br>Desse total, <b>${R$(T.parado)}</b> estão em conta sem render nada.`;
    if(T.essenciais>0)html+=`<br><br>Isso cobre <b>${(T.liquido/T.essenciais).toFixed(1)} meses</b> das suas contas obrigatórias, se a renda parasse hoje.`;
    return{html,chips:['tenho dinheiro parado?','minha reserva tá boa?']};
  }

  case 'reserva': {
    if(!T.essenciais)return semDados();
    const alvo=T.essenciais*6;
    let html=`Você tem ${D(T.liquidez)} de resgate rápido. Suas contas obrigatórias somam ${R$(T.essenciais)} por mês, então isso cobre <b>${T.mesesReserva.toFixed(1)} meses</b>.`;
    html+=`<div class="conta">Contas obrigatórias  ${_brl(T.essenciais)} por mês\nAlvo de 6 meses      ${_brl(alvo)}\nDisponível rápido    ${_brl(T.liquidez)}\n${T.liquidez<alvo?`Falta                ${_brl(alvo-T.liquidez)}`:`Acima do alvo em     ${_brl(T.liquidez-alvo)}`}</div>`;
    if(T.liquidez<alvo&&T.sobra>0)html+=`<br>Guardando a sobra deste mês (${R$(T.sobra)}), você chegaria lá em ${Math.ceil((alvo-T.liquidez)/T.sobra)} meses.`;
    return{html,chips:['quanto eu tenho?','tenho dinheiro parado?']};
  }

  case 'divida': {
    if(!DB.dividas.length&&!T.faturaAberta)return{html:'Você não tem nenhuma dívida nem fatura em aberto registrada. Se tiver alguma, dá para cadastrar em <b>Início → Seu dinheiro</b>.',chips:['quanto eu tenho?']};
    let html='';
    if(T.faturaAberta>0){
      html+=`Fatura em aberto: ${D(T.faturaAberta)}. Você tem ${R$(T.liquidez)} de resgate rápido, então ela ${T.liquidez>=T.faturaAberta?'<b>está coberta</b>':'<b>não está coberta</b>'}.`;
    }
    if(DB.dividas.length){
      const ord=[...DB.dividas].sort((a,b)=>b.taxa-a.taxa);
      html+=`${html?'<br><br>':''}Dívidas somam ${D(T.divida)}. A mais cara é <b>${ord[0].nome}</b>, a ${pc(ord[0].taxa,1)} ao mês — ${pc(Math.pow(1+ord[0].taxa,12)-1)} ao ano.`;
      html+=grafico(ord.map(d=>({n:d.nome,v:d.saldo})));
      html+=`<div class="conta">Dívida mais cara  ${pc(ord[0].taxa,1)} ao mês\nMelhor aplicação  ${pc(cdiM,2)} ao mês\nDiferença         ${pc(ord[0].taxa-cdiM,2)} ao mês a favor de quitar\n\nSaldo hoje        ${_brl(ord[0].saldo)}\nSe ficar 12 meses ${_brl(ord[0].saldo*Math.pow(1+ord[0].taxa,12))}</div>`;
      html+=`<br>Enquanto essa taxa for maior que a do seu investimento, cada real usado para abatê-la rende mais do que qualquer aplicação segura.`;
    }
    return{html,chips:['quanto eu tenho?','vale a pena pagar tudo no cartão?']};
  }

  case 'parado': {
    if(!T.emConta)return{html:'Você ainda não registrou seus saldos. Sem isso não consigo ver se tem dinheiro parado.',chips:['quanto eu tenho?']};
    if(T.parado<=0)return{html:`Nada parado: os ${R$(T.emConta)} que você tem em conta estão todos rendendo.`,chips:['quanto eu tenho?']};
    const colchao=T.essenciais*.3,oc=Math.max(0,T.parado-colchao);
    let html=`Você tem ${D(T.parado)} em conta sem render. Guardando um colchão de ${R$(colchao)} para o dia a dia, sobram ${D(oc)} ociosos.`;
    html+=`<div class="conta">Parado           ${_brl(T.parado)}\nColchão do mês   ${_brl(colchao)}\nOcioso           ${_brl(oc)}\nCDI ao mês       ${pc(cdiM,2)}\nDeixa de render  ${_brl(oc*cdiM)} por mês\nEm 12 meses      ${_brl(oc*DB.config.cdi)}</div>`;
    html+=`<br>Não vou dizer onde colocar — isso é decisão sua e depende de coisas que eu não sei. O que dá para dizer é que qualquer aplicação com resgate imediato já elimina essa perda, e que dívida cara, se houver, rende mais que qualquer aplicação.`;
    return{html,chips:['e minhas dívidas','minha reserva tá boa?']};
  }

  case 'credito_plano': {
    const cartao=DB.cartoes[0];
    if(!cartao)return{html:'Você ainda não cadastrou um cartão. Sem as datas de fechamento e vencimento não consigo calcular o ganho.',chips:['quanto eu tenho?']};
    let janela=cartao.vencimento-cartao.fechamento;if(janela<=0)janela+=30;
    const flut=15+janela,base=T.noCredito||T.saidas;
    const bruto=base*flut*cdiD,liq=bruto*(1-irDe(365));
    const cobre=T.liquidez>=T.faturaAberta;
    let html=`Com fechamento no dia ${cartao.fechamento} e vencimento no ${cartao.vencimento}, o que você compra fica em média <b>${flut} dias</b> rendendo antes de sair da conta.`;
    html+=`<div class="conta">Gasto no crédito   ${_brl(base)}\nFlutuação média    ${flut} dias\nCDI ao dia         ${(cdiD*100).toFixed(4)}%\nGanho bruto        ${_brl(bruto)} por mês\nMenos IR (17,5%)   ${_brl(liq)} por mês\nEm 12 meses        ${_brl(liq*12)}</div>`;
    html+=`<br>É dinheiro de graça, mas é troco: ${D(liq)} por mês. O que decide se vale a pena não é o ganho, é a disciplina.`;
    html+=`<br><br>A conta inverte de sinal na hora que você atrasa ou parcela. Um mês de rotativo a 11% apaga <b>${Math.round(0.11*base/Math.max(liq,1))} meses</b> de flutuação.`;
    html+=`<br><br>Sua fatura em aberto é de ${R$(T.faturaAberta)} e você tem ${R$(T.liquidez)} disponíveis. ${cobre?'<b>Está coberta</b> — a estratégia está funcionando como deveria.':'<b>Não está coberta</b> — nesse cenário o plano vira risco, não ganho.'}`;
    return{html,chips:['e minhas dívidas','quanto eu tenho?']};
  }

  case 'assinaturas': {
    const rec=DB.recorrentes.filter(r=>r.tipo!=='entrada');
    const ass=T.categorias.find(c=>c.n==='Assinaturas');
    if(!rec.length&&!ass)return{html:'Você não tem recorrentes cadastrados nem gastos em Assinaturas. Dá para cadastrar os fixos na aba <b>Plano</b> — aí eu passo a cobrar você deles todo mês.',chips:['onde meu dinheiro tá indo?']};
    let html='';
    if(ass)html+=`Em Assinaturas você gastou ${D(ass.gasto)} neste mês.`;
    if(rec.length){
      const tot=soma(rec.map(r=>r.valor));
      html+=`${html?'<br><br>':''}Seus fixos somam ${D(tot)} por mês, ou ${R$(tot*12)} por ano.`;
      html+=grafico(rec.map(r=>({n:r.nome,v:r.valor})));
      const i=aoMes(DB.config.cdi);
      html+=`<div class="conta">Por mês     ${_brl(tot)}\nPor ano     ${_brl(tot*12)}\nEm 5 anos, se rendessem  ${_brl(tot*(Math.pow(1+i,60)-1)/i)}</div>`;
      html+=`<br>Não é um argumento para cancelar tudo — é só o tamanho real do que se repete sem você pensar.`;
    }
    return{html,chips:['onde meu dinheiro tá indo?','tô dentro do plano?']};
  }

  case 'meta': {
    if(!DB.metas.length)return{html:'Você ainda não tem metas. Dá para criar na aba <b>Metas</b> — eu calculo quanto precisa guardar por mês, já contando o rendimento.',chips:['quanto sobrou?']};
    let html='Suas metas:';
    html+=grafico(DB.metas.map(m=>({n:m.n,v:m.atual})));
    DB.metas.forEach(m=>{
      const falta=Math.max(0,m.alvo-m.atual);
      if(falta<=0){html+=`<br><b>${esc(m.n)}</b>: alcançada.`;return}
      const ms=Math.max(1,Math.round((new Date(m.prazo)-new Date())/2629800000));
      const i=aoMes(m.taxa||DB.config.cdi),c=Math.pow(1+i,ms);
      const pmt=Math.max(0,(m.alvo-m.atual*c)*i/(c-1));
      html+=`<br><br><b>${esc(m.n)}</b>: ${pc(m.atual/m.alvo)} do caminho. Faltam ${R$(falta)} em ${ms} meses — ${D(pmt)} por mês.`;
      if(T.sobra>0&&pmt>T.sobra)html+=` Sua sobra atual é de ${R$(T.sobra)}, menor que isso.`;
    });
    return{html,chips:['quanto sobrou?','como vou fechar o mês?']};
  }

  case 'renda': {
    if(!T.entradas&&!T.beneficioIn)return semDados();
    let html=`Neste mês entraram ${D(T.entradas)}${T.beneficioIn>0?`, mais ${R$(T.beneficioIn)} de vale refeição`:''}.`;
    const ent=T.lanc.filter(l=>l.tipo==='entrada');
    if(ent.length>1)html+=grafico(ent.map(l=>({n:l.cat,v:l.valor})));
    const med=soma(T.historico.filter(h=>h.entradas>0).map(h=>h.entradas))/Math.max(1,T.historico.filter(h=>h.entradas>0).length);
    if(med>0)html+=`<br>Sua média dos últimos meses é ${R$(med)}.`;
    if(T.entradas>0)html+=`<br><br>Do que entrou, ${pc(T.essenciais/T.entradas)} foram para contas obrigatórias, ${pc(T.desejos/T.entradas)} para escolhas suas e ${pc((T.sobra+T.aportes)/T.entradas)} ficaram guardados ou investidos.`;
    return{html,chips:['onde meu dinheiro tá indo?','quanto sobrou?']};
  }

  case 'ajuda': default: {
    const nome=perfil().nome;
    let html=q.intencao==='ajuda'
      ?`Oi, ${esc(nome)}. Eu leio o que você registra e mostro a realidade dos seus números — não digo o que comprar nem onde investir.`
      :`Não entendi bem essa. Mas eu sei responder coisas assim:`;
    html+=`<br><br><b>Registrar</b> — "gastei 50 no mercado", "recebi 3800 de salário", "investi 500"<br>
    <b>Entender</b> — "onde meu dinheiro tá indo?", "quanto gastei em restaurantes?"<br>
    <b>Decidir</b> — "posso gastar 400 num tênis?", "como vou fechar o mês?"<br>
    <b>Conferir</b> — "quanto eu tenho?", "minha reserva tá boa?", "e minhas dívidas"`;
    if(LEITURAS.length)html+=`<br><br>De olho nos seus números agora: <b>${LEITURAS[0].t.toLowerCase()}</b>. ${LEITURAS[0].txt}`;
    return{html,chips:['onde meu dinheiro tá indo?','como vou fechar o mês?','quanto eu tenho?']};
  }}
}

/* ═════════ TELAS ═════════ */
// bloco simples. `caixa:true` desenha uma superfície; sem isso é só conteúdo sobre o fundo.
const card=o=>`<div class="card${o.tap?' tap':''}${o.caixa?' caixa':''}"${o.tap?` role="button" tabindex="0" data-act="${o.tap}"${o.val!==undefined?` data-val="${esc(o.val)}"`:''}`:''}><div class="in">${o.html}</div></div>`;
const barra=(v,tot)=>`<div class="bar"><i class="${v>tot?'over':''}" style="width:${Math.min(100,tot>0?v/tot*100:0)}%"></i></div>`;
const seletorMes=()=>`<div class="segs" style="margin-top:20px">
  <button data-act="mesAnt" style="flex:0 0 46px" aria-label="Mês anterior">‹</button>
  <button style="flex:3" aria-pressed="true">${nomeMes(mesVisto)}</button>
  <button data-act="mesProx" style="flex:0 0 46px" aria-label="Próximo mês">›</button></div>`;

const TELAS={};

TELAS.inicio=()=>{
  if(T.vazio)return `
    <div class="topo"><div class="t-rotulo">Começando</div>
      <div class="val"><span class="num-xl">R$ 0,00</span></div>
      <div class="ctx">Registre o primeiro gasto e o painel começa a responder três perguntas de relance:
        quanto você tem, o que aconteceu e se tem algo fora do lugar.</div></div>
    <button class="btn" data-act="novoLanc">Registrar um gasto</button>
    <button class="btn sec" data-act="ir" data-val="oraculo">Conversar com o Oráculo</button>
    <button class="btn sec" data-act="exemplo">Ver com dados de exemplo</button>`;

  /* ── 1. QUANTO EU TENHO ──────────────────────────────────
     A pesquisa é clara: o número que decide o comportamento do
     dia deve dominar. Num app de orçamento, esse número não é o
     patrimônio — é o que ainda dá para gastar neste mês.        */
  const temPlano=T.planoTotal>0;
  const disponivel=temPlano?T.restanteOrc:T.sobra;
  const negativo=disponivel<0;

  /* ── ritmo: o mês corre numa velocidade, o dinheiro em outra ── */
  const pctTempo=Math.min(100,T.diaHoje/T.diasMes*100);
  const pctGasto=temPlano?Math.min(150,T.saidas/T.planoTotal*100):0;
  const adiantado=pctGasto>pctTempo+5;

  let veredito='';
  if(temPlano&&T.ehAtual&&T.diaHoje<=2){
    veredito='O mês mal começou — a projeção fica confiável depois de alguns dias de lançamento.';
  }else if(temPlano&&T.ehAtual){
    veredito=adiantado
      ?`Você já usou <b>${pc(T.saidas/T.planoTotal)}</b> do plano com <b>${pc(T.diaHoje/T.diasMes)}</b> do mês passado. Nesse ritmo fecha em ${R$(T.projecao)}.`
      :`Você usou <b>${pc(T.saidas/T.planoTotal)}</b> do plano com ${pc(T.diaHoje/T.diasMes)} do mês passado. Está dentro do compasso.`;
  }

  /* ── 3. TEM ALGO ERRADO ── */
  const top=LEITURAS[0];

  /* ── 2. O QUE ACONTECEU ── */
  const recentes=[...DB.lancamentos].sort((a,b)=>b.data.localeCompare(a.data)||b.id.localeCompare(a.id)).slice(0,4);
  const maxHist=Math.max(...T.historico.map(h=>h.saidas),1);

  return `
  <div class="topo">
    <div class="t-rotulo">${temPlano?'Disponível este mês':'Sobra do mês'}</div>
    <div class="val"><span class="num-xl" data-negativo="${negativo?1:0}">${R$(Math.abs(disponivel))}</span>
      ${negativo?'<span class="t-apoio" style="color:var(--negativo)">acima do plano</span>':''}</div>
    <div class="ctx">${temPlano
      ?`${R$(T.saidas)} gastos de ${R$(T.planoTotal)} planejados.${T.ehAtual&&T.diasRestantes>0&&!negativo?` Dá <b>${R$(T.porDia)} por dia</b> nos ${T.diasRestantes} dias que faltam.`:''}`
      :`Entraram ${R$(T.entradas)} e saíram ${R$(T.saidas)}. Defina um plano para o app acompanhar o ritmo.`}</div>

    ${temPlano?`<div class="ritmo">
      <div class="lin"><span class="rot">Mês</span>
        <span class="trilho"><i style="width:${pctTempo}%"></i></span>
        <span class="pct">${Math.round(pctTempo)}%</span></div>
      <div class="lin gasto ${adiantado?'acima':''}"><span class="rot">Gasto</span>
        <span class="trilho"><i style="width:${Math.min(100,pctGasto)}%"></i></span>
        <span class="pct">${Math.round(pctGasto)}%</span></div>
      ${veredito?`<div class="veredito">${veredito}</div>`:''}
    </div>`:''}
  </div>

  ${top?`<button class="alerta" data-sev="${top.sev}" data-act="perguntar" data-val="${top.id}">
    <div class="top"><h3>${top.t}</h3><span class="seta">→</span></div>
    <p>${top.txt}</p></button>`:''}

  ${T.pendentes.length?`<button class="alerta" data-sev="atencao" data-act="lancarFixos">
    <div class="top"><h3>${T.pendentes.length} ${T.pendentes.length>1?'fixos pendentes':'fixo pendente'}</h3><span class="seta">Lançar</span></div>
    <p>${esc(T.pendentes.slice(0,4).map(r=>r.nome).join(' · '))}${T.pendentes.length>4?' ...':''}</p></button>`:''}

  <div class="duo">
    <div><div class="t-rotulo">Patrimônio</div><div class="n">${R$(T.liquido)}</div>
      <div class="s">${T.parado>0?`${R$(T.parado)} sem render`:'tudo rendendo'}</div></div>
    <div><div class="t-rotulo">${T.faturaAberta>0?'Fatura aberta':'Investido'}</div>
      <div class="n">${R$(T.faturaAberta>0?T.faturaAberta:T.invest)}</div>
      <div class="s">${T.faturaAberta>0
        ?(T.liquidez>=T.faturaAberta?'coberta pela reserva':'<span style="color:var(--negativo)">acima do disponível</span>')
        :(T.mesesReserva>0?`reserva de ${T.mesesReserva.toFixed(1)} meses`:'informe seus saldos')}</div></div>
  </div>

  <div class="sec">
    <div class="sec-h"><h2>O que aconteceu</h2><button data-act="ir" data-val="extrato">Ver tudo</button></div>
    ${recentes.length?recentes.map(l=>{
      const ent=l.tipo==='entrada';
      return `<div class="mini" data-act="editarLanc" data-val="${l.id}">
        <span class="d">${l.data.slice(8)}/${l.data.slice(5,7)}</span>
        <span class="n">${esc(l.desc||l.cat)}</span>
        <span class="v ${ent?'mais':''}">${ent?'+':'−'} ${R$(l.valor)}</span></div>`}).join('')
      :'<div class="empty"><p>Nada registrado ainda.</p></div>'}
  </div>

  <div class="sec">
    <div class="sec-h"><h2>Onde está indo</h2><button data-act="ir" data-val="orcamento">Ver plano</button></div>
    ${T.categorias.length?T.categorias.slice(0,5).map(c=>{
      const est=c.plano>0&&c.gasto>c.plano;
      const base=c.plano||T.categorias[0].gasto||1;
      return `<div class="catlin">
        <div class="cab"><span class="nome">${esc(c.n)}</span>
          <span class="val ${est?'estourou':''}">${R$(c.gasto)}</span></div>
        <div class="trilho"><i class="${est?'estourou':''}" style="width:${Math.min(100,c.gasto/base*100)}%"></i></div>
        <div class="sub">${c.plano
          ?(est?`${R$(c.gasto-c.plano)} acima do limite de ${R$(c.plano)}`:`${R$(c.plano-c.gasto)} livres de ${R$(c.plano)}`)
          :`${pc(c.gasto/(T.gastoTotal||1))} de tudo que saiu`}</div>
      </div>`}).join('')
      :'<div class="empty"><p>Nenhum gasto neste mês.</p></div>'}
  </div>

  <div class="sec">
    <div class="sec-h"><h2>Seis meses</h2><span class="cnt">média ${R$(T.media3)}</span></div>
    <div class="hist">${T.historico.map(h=>`
      <div class="col ${h.m===T.mes?'atual':''}"><i style="height:${Math.max(2,h.saidas/maxHist*100)}%"></i></div>`).join('')}</div>
    <div class="histl">${T.historico.map(h=>`<span class="${h.m===T.mes?'atual':''}">${h.curto}</span>`).join('')}</div>
    <div class="t-apoio" style="margin-top:14px">${
      T.media3>0&&T.saidas>0
        ?`Este mês está <b style="color:var(--tinta)">${pc(Math.abs((T.saidas-T.media3)/T.media3))} ${T.saidas>T.media3?'acima':'abaixo'}</b> da sua média dos três meses anteriores.`
        :`Ainda não dá para comparar — a média aparece quando houver pelo menos um mês fechado.`}</div>
  </div>

  <div class="sec">
    <div class="sec-h"><h2>Seu dinheiro</h2><button data-act="patrimonio">Editar</button></div>
    ${[['Em conta e caixinhas',T.emConta],['Investido',T.invest],['Dívidas',-T.divida],['Fatura em aberto',-T.faturaAberta]]
      .filter(([,v])=>v!==0).map(([n,v])=>`<div class="mini" data-act="patrimonio">
        <span class="n">${n}</span>
        <span class="v"${v<0?' style="color:var(--negativo)"':''}>${v<0?'− ':''}${R$(Math.abs(v))}</span></div>`).join('')
      ||'<div class="empty"><p>Toque em Editar para informar seus saldos.</p></div>'}
  </div>`;
};

TELAS.extrato=()=>{
  const lanc=DB.lancamentos.filter(l=>mesDe(l.data)===mesVisto).sort((a,b)=>b.data.localeCompare(a.data)||b.id.localeCompare(a.id));
  const porDia=new Map();
  lanc.forEach(l=>{if(!porDia.has(l.data))porDia.set(l.data,[]);porDia.get(l.data).push(l)});
  return `${seletorMes()}
  <div class="duo" style="grid-template-columns:1fr 1fr 1fr">
    ${[['Entrou',T.entradas],['Saiu',T.saidas],['Sobrou',T.sobra]].map(([n,v])=>`
      <div><div class="t-rotulo">${n}</div><div class="n" style="font-size:20px">${R$(v)}</div></div>`).join('')}
  </div>
  ${lanc.length?[...porDia.entries()].map(([dia,ls])=>`
    <div class="dia">${new Date(dia+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'short'})}</div>
    ${card({html:ls.map(l=>{
      const ent=l.tipo==='entrada',ap=l.tipo==='aporte';
      return `<div class="row click" data-act="editarLanc" data-val="${l.id}">
        <div class="tx"><b>${esc(l.desc||l.cat)}</b><span>${esc(l.cat)}${ap?' · investido':''}</span></div>
        <div class="rt"><b${ent?' style="color:var(--positivo)"':''}>${ent?'+':'−'} ${R$(l.valor)}</b>
          ${l.meio==='credito'?'<span class="pill cr">crédito</span>':l.meio==='beneficio'?'<span class="pill nt">vale</span>':''}</div></div>`}).join('')})}
  `).join(''):`<div class="empty"><div class="e">◇</div><p>Nenhum lançamento em ${nomeMes(mesVisto)}.</p></div>`}
  <button class="btn" data-act="novoLanc">Registrar lançamento</button>`;
};

TELAS.orcamento=()=>`
  ${seletorMes()}
  <div class="sec" style="margin-top:14px">
    <div class="sec-h"><h2>Plano do mês</h2><button data-act="editarOrcamento">Ajustar</button></div>
    ${card({html:`
      <div class="num-l">${R$(T.saidas)}</div>
      <div class="t-apoio" style="margin-top:6px">de ${R$(T.planoTotal)} planejados</div>
      ${barra(T.saidas,T.planoTotal||1)}
      <div style="font-size:13.5px;color:var(--tinta2);margin-top:12px;line-height:1.5">
        ${!T.planoTotal?'Toque em Ajustar para definir seus limites.'
          :T.restanteOrc<0?`Você passou ${R$(-T.restanteOrc)} do plano.`
          :`Restam ${R$(T.restanteOrc)}${T.ehAtual&&T.diasRestantes?` — ${R$(T.porDia)} por dia nos ${T.diasRestantes} dias que faltam.`:'.'}`}</div>`})}
  </div>

  <div class="sec">
    <div class="sec-h"><h2>Por categoria</h2></div>
    ${T.categorias.length?T.categorias.map(c=>{
      const est=c.plano>0&&c.gasto>c.plano,sem=!c.plano;
      return `<div class="catlin" data-act="editarOrcamento" role="button" tabindex="0" style="cursor:pointer">
        <div class="cab"><span class="nome">${esc(c.n)}${c.e?' <span style="font-size:11.5px;color:var(--tinta3)">obrigatória</span>':''}</span>
          <span class="val ${est?'estourou':''}">${R$(c.gasto)}</span></div>
        <div class="trilho"><i class="${est?'estourou':''}" style="width:${Math.min(100,c.gasto/(c.plano||c.gasto||1)*100)}%"></i></div>
        <div class="sub" style="display:flex;justify-content:space-between;gap:10px">
          <span>${sem?'sem limite definido':`limite de ${R$(c.plano)}`}</span>
          <span>${sem?'toque para definir':est?`${R$(c.gasto-c.plano)} acima`:`${R$(c.plano-c.gasto)} livres`}</span></div>
      </div>`}).join('')
      :'<div class="empty"><p>Defina limites e o app acompanha para você.</p></div>'}
  </div>

  <div class="sec">
    <div class="sec-h"><h2>Fixos do mês</h2><button data-act="novoRecorrente">+ Novo</button></div>

function previewMeta(){
  const el=document.getElementById('mtPrev');if(!el)return;
  const alvo=+(document.getElementById('mtAlvo')?.dataset.raw||0);
  const atual=+(document.getElementById('mtAtual')?.dataset.raw||0);
  const ms=+(document.getElementById('mtMeses')?.value||12);
  const i=aoMes(DB.config.cdi),c=Math.pow(1+i,ms);
  const pmt=Math.max(0,(alvo-atual*c)*i/(c-1)),sem=Math.max(0,(alvo-atual)/ms);
  el.textContent=_brl(pmt);
  document.getElementById('mtPrevN').textContent=alvo>0
    ?`por mês, durante ${ms} ${ms>1?'meses':'mês'}. Sem render seriam ${_brl(sem)} — o rendimento poupa ${_brl(sem-pmt)}.`
    :'por mês, até chegar lá';
}
function mascara(el){
  const d=el.value.replace(/\D/g,'').slice(0,11);
  el.dataset.raw=d?(parseInt(d,10)/100):'';
  el.value=d?(parseInt(d,10)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):'';
}
function lerCampos(){
  document.querySelectorAll('#shBody [data-campo]').forEach(el=>{
    const c=el.dataset.campo;
    if(el.dataset.money!==undefined){
      rascunho[c]=el.dataset.raw?+el.dataset.raw:0;
    }else if(c==='dia'){
      rascunho[c]=el.value===''?'':+el.value;
    }else{
      rascunho[c]=el.value;
    }
  });
}
const redesenhar=(fn)=>{lerCampos();document.getElementById('shBody').innerHTML=fn()};

  olho:()=>{ocultar=!ocultar;guardar('ocultar',ocultar);

  mesAnt:()=>{const d=new Date(mesVisto+'-01T12:00');d.setMonth(d.getMonth()-1);mesVisto=d.toISOString().slice(0,7);atualizar()},
  mesProx:()=>{const d=new Date(mesVisto+'-01T12:00');d.setMonth(d.getMonth()+1);

  exemplo:()=>{carregarExemplo();fecharFolha();atualizar();aviso('Dados de exemplo carregados')},

  confApagar:()=>{DB=vazio();persistir();fecharFolha();tela='inicio';atualizar();aviso('Dados apagados')},

  /* perfis */
  perfis:()=>abrirFolha('Perfis',formPerfis()),
  trocar:v=>{if(v!==perfilAtivo)trocarPerfil(v);else fecharFolha()},
  criarPerfil:()=>{
    const n=document.getElementById('pfNome').value.trim();
    if(!n){aviso('Dê um nome ao perfil');return}
    const p={id:uid(),nome:n};
    PERFIS.push(p);guardar('perfis',PERFIS);trocarPerfil(p.id);aviso(`Perfil de ${n} criado`)},
  apagarPerfil:()=>{

    const id=perfilAtivo,nome=perfil().nome;

    try{localStorage.removeItem('gr.db.'+id)}catch(e){}

    abrirFolha('Novo lançamento',formLanc)},

/* ═════════ CONVERSA ═════════ */
function conversar(txt){
  if(tela!=='oraculo')irPara('oraculo');
  DB.chat.push({de:'eu',txt});
  render();rolarChat();
  const q=entender(txt);
  const espera=Math.min(700,260+txt.length*8);
  setTimeout(()=>{
    let r;
    try{r=responder(q)}
    catch(e){r={html:'Deu um problema aqui ao calcular isso. Tenta perguntar de outro jeito?',chips:['o que você faz?']}}
    DB.chat.push({de:'or',html:r.html,chips:r.chips,desfazer:r.desfazer});
    if(DB.chat.length>60)DB.chat=DB.chat.slice(-60);
    persistir();atualizar();rolarChat();
  },espera);
}
function rolarChat(){
  requestAnimationFrame(()=>{const m=document.getElementById('view');if(m)m.scrollTop=m.scrollHeight});
}
function pintarSugestoes(){
  const el=document.getElementById('sugs');if(!el)return;
  const ult=[...DB.chat].reverse().find(m=>m.de==='or'&&m.chips);
  const chips=ult?ult.chips:['onde meu dinheiro tá indo?','quanto sobrou?'];
  el.innerHTML=chips.map(c=>`<button data-act="sugestao" data-val="${esc(c)}">${esc(c)}</button>`).join('');
}
let reconhecimento=null;
function ouvir(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const bt=document.getElementById('btMic');
  if(!SR){aviso('Este aparelho não permite ditado aqui — pode digitar');return}
  if(reconhecimento){reconhecimento.stop();reconhecimento=null;bt.dataset.ouvindo='0';return}
  reconhecimento=new SR();
  reconhecimento.lang='pt-BR';reconhecimento.interimResults=false;
  bt.dataset.ouvindo='1';
  reconhecimento.onresult=e=>{const t=e.results[0][0].transcript;document.getElementById('entrada').value=t;
    setTimeout(()=>ACOES.enviar(),150)};
  reconhecimento.onerror=()=>{aviso('Não consegui ouvir');};
  reconhecimento.onend=()=>{bt.dataset.ouvindo='0';reconhecimento=null};
  try{reconhecimento.start()}catch(e){bt.dataset.ouvindo='0';reconhecimento=null}
}

function irPara(id){
  if(id===tela){$v().scrollTo({top:0,behavior:'smooth'});return}

  {mark:'',t:'Como quer começar?',p:'Pode começar com a folha em branco ou ver o app funcionando com dados de exemplo, e apagar depois.',bt:'Começar do zero',alt:'Ver com exemplo'},
];
let passo=0;
const tour=document.getElementById('tour');
function pintarTour(){
  const s=PASSOS[passo];
  tour.innerHTML=`<div class="body"><div class="mark">${passo+1} de ${PASSOS.length}</div><h2>${s.t}</h2>
    ${s.p?`<p>${s.p}</p>`:''}</div>
    <div class="foot"><div class="dots">${PASSOS.map((_,k)=>`<i class="${k===passo?'on':''}"></i>`).join('')}</div>
    <button class="btn" data-tour="next">${s.bt}</button>
    ${s.alt?`<button class="btn sec" data-tour="exemplo">${s.alt}</button>`:'<button class="btn sec" data-tour="skip">Pular</button>'}</div>`;
}
tour.addEventListener('click',e=>{
  const b=e.target.closest('[data-tour]');if(!b)return;
  const a=b.dataset.tour;
  if(a==='exemplo'){carregarExemplo();tour.dataset.open='0';guardar('viuTour',true);atualizar();aviso('Dados de exemplo carregados');return}
  if(a==='skip'||passo>=PASSOS.length-1){tour.dataset.open='0';guardar('viuTour',true);atualizar();return}
  passo++;pintarTour();
});

/* ═════════ UM ÚNICO OUVINTE PARA TUDO ═════════ */
document.getElementById('app').addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const fn=ACOES[el.dataset.act];
  if(!fn)return;
  e.preventDefault();
  fn(el.dataset.val,el);
});
document.getElementById('app').addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const el=e.target.closest('[data-act]');
  if(!el||el.tagName==='INPUT'||el.tagName==='SELECT')return;
  e.preventDefault();ACOES[el.dataset.act]?.(el.dataset.val,el);
});
document.getElementById('shBody').addEventListener('input',e=>{
  if(e.target.dataset.money!==undefined||e.target.dataset.orc!==undefined||
     e.target.dataset.conta!==undefined||e.target.dataset.inv!==undefined||e.target.dataset.div!==undefined)
    if(e.target.inputMode==='numeric')mascara(e.target);
  if(document.getElementById('mtPrev'))previewMeta();
  const tot=document.getElementById('orcTotal');
  if(tot){let s=0;document.querySelectorAll('[data-orc]').forEach(el=>s+=+(el.dataset.raw||0));tot.textContent=_brl(s)}
});
document.getElementById('entrada').addEventListener('keydown',e=>{if(e.key==='Enter')ACOES.enviar()});
$v().addEventListener('scroll',()=>{
  document.querySelector('header').dataset.scrolled=$v().scrollTop>4?'1':'0'},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecharFolha()});
if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{
  document.querySelector('.phone').style.height=window.visualViewport.height+'px'});

render();
if(!buscar('viuTour',false)&&DB.lancamentos.length===0){tour.dataset.open='1';pintarTour()}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
