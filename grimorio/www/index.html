<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Grimório — seu dinheiro, claro</title>
<meta name="theme-color" content="#06090C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grimório">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Barlow:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#06090C; --panel:#0D141B; --panel2:#101922;
  /* contraste corrigido: todos os tons de texto passam em AA sobre o fundo */
  --ink:#E4EDF2;        /* texto principal      */
  --ink-2:#B4C4CE;      /* texto secundário     */
  --ink-3:#8A9CA7;      /* rótulos e apoio      */
  --line:rgba(255,255,255,.09);

  --azul:#5FA3CC; --ambar:#DCA84B; --verde:#5FBB80;
  --brasa:#E0705A; --violeta:#A388E0; --ouro:#E4CE9A;

  --sans:'Barlow',system-ui,-apple-system,sans-serif;
  --disp:'Cinzel',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --notch:14px;
  --tap:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;height:100%}
body{
  margin:0;height:100vh;height:100dvh;overflow:hidden;
  overscroll-behavior:none;touch-action:manipulation;
  font-family:var(--sans);font-size:16px;line-height:1.5;color:var(--ink);
  background:
    radial-gradient(900px 620px at 80% -10%,rgba(48,88,98,.20),transparent 60%),
    radial-gradient(700px 560px at 0% 110%,rgba(70,46,92,.16),transparent 58%),
    var(--void);
  display:flex;justify-content:center;align-items:center;padding:20px 12px;
}
@media(max-width:640px){body{padding:0;align-items:stretch}}

/* Casca do app: altura fixa igual à da tela.
   Só o <main> rola — cabeçalho e menu ficam sempre visíveis. */
.phone{
  position:relative;width:100%;max-width:420px;
  height:100vh;height:min(920px,calc(100dvh - 40px));
  display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#080C11,#05080B);
  border:1px solid #17222B;border-radius:26px;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.9);
}
@media(max-width:640px){
  .phone{border:0;border-radius:0;max-width:none;height:100vh;height:100dvh}
}

/* ─────────── cabeçalho ─────────── */
header{
  flex:none;z-index:4;position:relative;user-select:none;
  padding:calc(12px + env(safe-area-inset-top)) 16px 11px;
  display:flex;align-items:center;gap:8px;
  border-bottom:1px solid transparent;
  background:linear-gradient(180deg,rgba(12,18,24,.92),rgba(8,12,17,.55));
  transition:border-color .2s,box-shadow .2s;
}
header[data-scrolled="1"]{
  border-bottom-color:var(--line);
  background:rgba(9,14,19,.98);
  box-shadow:0 8px 24px -12px rgba(0,0,0,.9);
}
header .who{flex:1;min-width:0}
header .who .hi{font-size:12.5px;color:var(--ink-3);letter-spacing:.01em;line-height:1.2}
header .who .tt{font-family:var(--disp);font-size:16px;letter-spacing:.1em;color:var(--ink);margin-top:2px;line-height:1.2}
.icobtn{
  width:44px;height:44px;flex:none;display:grid;place-items:center;
  background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:13px;
  color:var(--ink-2);font-size:18px;cursor:pointer;transition:transform .12s,background .12s;
}
.icobtn:active{transform:scale(.92)}
.icobtn:active{background:rgba(255,255,255,.11)}
.icobtn:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}

/* ─────────── conteúdo ─────────── */
main{
  flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;
  padding:2px 16px 30px;scrollbar-width:none;
}
main::-webkit-scrollbar{display:none}
main[data-anim="1"]{animation:entra .24s cubic-bezier(.22,.9,.32,1)}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){main[data-anim="1"]{animation:none}}

.sec{margin-top:22px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h h2{
  margin:0;font-family:var(--disp);font-size:13px;font-weight:600;
  letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);
}
.sec-h .cnt{font-size:13px;color:var(--ink-3)}

.card{
  --acc:var(--azul);position:relative;padding:1px;margin-bottom:12px;
  background:linear-gradient(155deg,color-mix(in srgb,var(--acc) 42%,transparent),rgba(120,150,165,.10) 60%);
  clip-path:polygon(0 0,calc(100% - var(--notch)) 0,100% var(--notch),100% 100%,var(--notch) 100%,0 calc(100% - var(--notch)));
}
.card>.in{
  clip-path:inherit;padding:15px;
  background:
    radial-gradient(130% 90% at 0% 0%,color-mix(in srgb,var(--acc) 10%,transparent),transparent 60%),
    linear-gradient(180deg,var(--panel2),var(--panel));
}
.card.tap{cursor:pointer}
.card.tap:active>.in{background:linear-gradient(180deg,#16212B,#111a22)}
.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.chead{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.chead .sg{
  width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;font-size:16px;
  color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);
}
.chead .nm{flex:1;font-size:15px;font-weight:500;letter-spacing:.02em;color:var(--ink)}
.chead .ex{font-size:22px;color:var(--ink-3);line-height:1}

/* ─────────── números ─────────── */
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero{text-align:center;padding:18px 0 4px}
.hero .lbl{font-size:13.5px;color:var(--ink-3);letter-spacing:.04em}
.hero .big{font-family:var(--mono);font-size:clamp(28px,9vw,36px);line-height:1.1;margin-top:6px;color:#F1F7FA;text-shadow:0 0 30px rgba(140,195,215,.2)}
.hero .sub{font-size:14.5px;color:var(--ink-2);margin-top:9px;max-width:300px;margin-left:auto;margin-right:auto}
.hero .sub b{color:var(--brasa);font-weight:500}

.val-lg{font-family:var(--mono);font-size:23px;color:var(--ink)}
.val-md{font-family:var(--mono);font-size:17px;color:var(--ink)}

/* ─────────── linhas de lista ─────────── */
.row{
  display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.row:last-child{border-bottom:0}
.row .ic{
  width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:11px;font-size:15px;
  color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--acc) 26%,transparent);
}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15.5px;font-weight:400;color:var(--ink);letter-spacing:.01em}
.row .tx span{display:block;font-size:13px;color:var(--ink-3);margin-top:2px}
.row .rt{text-align:right;flex:none}
.row .rt b{display:block;font-family:var(--mono);font-size:16px;font-weight:400;color:var(--ink)}

.pill{
  display:inline-block;margin-top:4px;padding:3px 9px;border-radius:20px;
  font-size:12px;font-weight:500;letter-spacing:.02em;white-space:nowrap;
}
.pill.ok{color:#8FD9AC;background:rgba(95,187,128,.15)}
.pill.no{color:#F0A08C;background:rgba(224,112,90,.16)}
.pill.nt{color:var(--ink-2);background:rgba(255,255,255,.07)}

/* ─────────── barras ─────────── */
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 55%,transparent),var(--acc))}

/* ─────────── anel ─────────── */
.ringbox{display:flex;flex-direction:column;align-items:center;gap:18px}
.ring{position:relative;width:min(186px,54vw);height:min(186px,54vw)}
.ring svg{width:100%;height:100%}
.ring svg{transform:rotate(-90deg);display:block}
.ring .core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .core b{font-family:var(--mono);font-size:30px;font-weight:500;color:#F1F7FA;line-height:1}
.ring .core span{font-size:13px;color:var(--ink-3);margin-top:6px}
.legend{width:100%;display:flex;flex-direction:column;gap:2px}
.lg{display:flex;align-items:center;gap:11px;min-height:44px;padding:6px 2px;border-bottom:1px solid rgba(255,255,255,.05)}
.lg:last-child{border-bottom:0}
.lg i{width:12px;height:12px;border-radius:4px;flex:none}
.lg .n{flex:1;font-size:15px;color:var(--ink-2)}
.lg .v{font-family:var(--mono);font-size:15px;color:var(--ink)}
.lg .p{font-size:13px;color:var(--ink-3);width:48px;text-align:right}

/* ─────────── ação prioritária ─────────── */
.first{
  --acc:var(--ouro);margin-top:16px;padding:1px;
  background:linear-gradient(150deg,rgba(228,206,154,.55),rgba(228,206,154,.12) 70%);
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
}
.first>.in{clip-path:inherit;padding:18px;background:linear-gradient(150deg,rgba(228,206,154,.09),rgba(13,20,27,.96) 60%)}
.first .kicker{display:flex;align-items:center;gap:9px;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ouro)}
.first .kicker .dot{width:9px;height:9px;border-radius:50%;background:var(--ouro);box-shadow:0 0 0 0 rgba(228,206,154,.5);animation:pulse 2.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(228,206,154,0)}100%{box-shadow:0 0 0 0 rgba(228,206,154,0)}}
@media(prefers-reduced-motion:reduce){.first .kicker .dot{animation:none}}
.first h3{margin:12px 0 8px;font-size:19px;font-weight:500;line-height:1.35;color:var(--ink)}
.first p{margin:0;font-size:15px;color:var(--ink-2);line-height:1.55}

/* ─────────── botões ─────────── */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:52px;padding:13px 16px;margin-top:16px;cursor:pointer;
  font-family:var(--sans);font-size:16px;font-weight:500;letter-spacing:.02em;border-radius:12px;
  color:#0A0F14;background:var(--acc);border:0;
}
.btn:active{filter:brightness(.9)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sec:active{background:rgba(255,255,255,.07)}
.btn.dgr{background:transparent;color:#F0A08C;border:1px solid rgba(224,112,90,.4)}
.btn.sm{min-height:44px;font-size:14.5px;margin-top:10px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{
  min-height:44px;padding:10px 15px;border-radius:22px;cursor:pointer;
  font-size:14.5px;color:var(--ink-2);background:rgba(255,255,255,.05);
  border:1px solid var(--line);font-family:var(--sans);
}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--acc) 20%,transparent);border-color:var(--acc);color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ─────────── formulário ─────────── */
.field{margin-top:18px}
.field>label{display:block;font-size:14px;color:var(--ink-2);margin-bottom:8px;font-weight:500}
.field .hint{font-size:13px;color:var(--ink-3);margin-top:7px;line-height:1.45}
.inp{
  display:flex;align-items:center;gap:8px;min-height:54px;padding:0 14px;border-radius:12px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
}
.inp:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.inp .pre{font-family:var(--mono);font-size:16px;color:var(--ink-3)}
.inp input,.inp select{
  flex:1;width:100%;min-width:0;background:none;border:0;outline:none;color:var(--ink);
  font-family:var(--sans);font-size:17px;padding:14px 0;
}
.inp input.mono{font-family:var(--mono)}
.inp select{font-size:16px;-webkit-appearance:none;appearance:none}
.inp select option{background:#101922;color:var(--ink)}
.preview{
  margin-top:16px;padding:14px 16px;border-radius:12px;
  background:rgba(163,136,224,.12);border:1px solid rgba(163,136,224,.28);
}
.preview .l{font-size:13.5px;color:var(--ink-2)}
.preview .v{font-family:var(--mono);font-size:24px;color:var(--ink);margin-top:5px}
.preview .n{font-size:13px;color:var(--ink-3);margin-top:6px;line-height:1.45}

/* ─────────── leituras do oráculo ─────────── */
.ins{--acc:var(--ouro)}
.ins .top{display:flex;align-items:flex-start;gap:12px}
.ins .sev{width:12px;height:12px;border-radius:50%;flex:none;margin-top:6px}
.sv-urgente{background:var(--brasa);box-shadow:0 0 10px rgba(224,112,90,.6)}
.sv-atencao{background:var(--ambar)}
.sv-contexto{background:var(--azul)}
.sv-saudavel{background:var(--verde)}
.ins h3{margin:0;font-size:17px;font-weight:500;color:var(--ink);line-height:1.35}
.ins .plain{margin:9px 0 0;font-size:15px;line-height:1.55;color:var(--ink-2)}
.ins .more{
  display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  min-height:46px;margin-top:12px;padding:0;background:none;border:0;cursor:pointer;
  font-family:var(--sans);font-size:14.5px;color:var(--ouro);border-top:1px solid var(--line);
}
.detail{display:none;padding-top:4px}
.detail[data-open="1"]{display:block}
.math{
  margin-top:12px;padding:14px;border-radius:10px;overflow-x:auto;
  font-family:var(--mono);font-size:13px;line-height:1.85;color:var(--ink-2);
  background:rgba(255,255,255,.045);border-left:3px solid rgba(228,206,154,.4);white-space:pre;
}
.opts{margin-top:14px}
.opts .t{font-size:13.5px;color:var(--ink-3);margin-bottom:8px}
.opts li{font-size:14.5px;color:var(--ink-2);line-height:1.5;margin-bottom:8px;list-style:none;padding-left:18px;position:relative}
.opts li::before{content:'◇';position:absolute;left:0;color:var(--ouro);font-size:11px;top:3px}
.concept{margin-top:14px;font-size:12.5px;color:var(--ink-3);letter-spacing:.04em}

/* ─────────── navegação ─────────── */
nav{
  flex:none;z-index:6;display:flex;user-select:none;
  padding:7px 4px calc(7px + env(safe-area-inset-bottom));
  background:rgba(8,12,17,.99);border-top:1px solid var(--line);
  box-shadow:0 -8px 24px -14px rgba(0,0,0,.9);
}
nav button{
  flex:1;min-height:52px;padding:8px 2px 6px;background:none;border:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink-3);
  font-family:var(--sans);position:relative;border-radius:12px;transition:color .15s;
}
nav button:active{background:rgba(255,255,255,.05)}
nav button .g{font-size:19px;line-height:1;transition:transform .18s}
nav button .t{font-size:11px;letter-spacing:.02em;line-height:1}
nav button[aria-current="page"]{color:var(--ouro)}
nav button[aria-current="page"] .g{transform:translateY(-1px)}
nav button[aria-current="page"]::before{
  content:'';position:absolute;top:0;left:28%;right:28%;height:2.5px;border-radius:0 0 3px 3px;
  background:var(--ouro);box-shadow:0 0 10px rgba(228,206,154,.6);
}
nav button:focus-visible{outline:2px solid var(--ouro);outline-offset:-3px}

/* ─────────── folha inferior ─────────── */
.backdrop{position:absolute;inset:0;z-index:10;background:rgba(3,6,9,.75);display:none}
.backdrop[data-open="1"]{display:block}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:11;max-height:90%;display:none;flex-direction:column;
  background:linear-gradient(180deg,#111A23,#0A1015);border-top:1px solid rgba(228,206,154,.28);
  border-radius:20px 20px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.6);
  animation:up .26s cubic-bezier(.2,.9,.3,1);
}
.sheet[data-open="1"]{display:flex}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .grab{width:42px;height:4px;border-radius:4px;background:rgba(255,255,255,.22);margin:10px auto 4px;flex:none}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:8px 18px 14px;border-bottom:1px solid var(--line);flex:none}
.sheet .sh h2{flex:1;margin:0;font-family:var(--disp);font-size:15px;letter-spacing:.12em;color:var(--ink)}
.sheet .sb{overflow-y:auto;overscroll-behavior:contain;padding:16px 18px calc(28px + env(safe-area-inset-bottom))}
.sheet .sb::-webkit-scrollbar{display:none}

/* ─────────── boas-vindas ─────────── */
.tour{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;background:linear-gradient(180deg,#0A1017,#060A0E)}
.tour[data-open="1"]{display:flex}
.tour .body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 28px;text-align:center}
.tour .mark{font-size:52px;line-height:1;color:var(--ouro);margin-bottom:22px;text-shadow:0 0 30px rgba(228,206,154,.35)}
.tour h2{font-family:var(--disp);font-size:24px;font-weight:600;letter-spacing:.06em;margin:0 0 14px;color:var(--ink)}
.tour p{font-size:16.5px;line-height:1.6;color:var(--ink-2);margin:0 auto;max-width:310px}
.tour .list{margin:22px auto 0;max-width:320px;text-align:left;width:100%}
.tour .list div{display:flex;gap:13px;align-items:flex-start;margin-bottom:14px;font-size:15.5px;color:var(--ink-2);line-height:1.45}
.tour .list b{color:var(--ink);font-weight:500}
.tour .list i{font-style:normal;font-size:19px;width:26px;flex:none;text-align:center}
.tour .foot{padding:20px 24px calc(28px + env(safe-area-inset-bottom));flex:none}
.dots{display:flex;justify-content:center;gap:8px;margin-bottom:18px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}
.dots i.on{background:var(--ouro);width:22px;border-radius:4px}

/* ─────────── aviso ─────────── */
.toast{
  position:absolute;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:30;padding:14px 16px;border-radius:12px;
  background:#18242E;border:1px solid rgba(228,206,154,.35);color:var(--ink);font-size:15px;
  box-shadow:0 12px 30px rgba(0,0,0,.5);display:none;align-items:center;gap:11px;
}
.toast[data-open="1"]{display:flex}

.empty{padding:40px 20px;text-align:center}
.empty .e{font-size:38px;color:var(--ink-3);opacity:.5}
.empty p{font-size:15.5px;color:var(--ink-2);margin:14px auto 0;max-width:260px;line-height:1.55}
.note{font-size:13.5px;line-height:1.6;color:var(--ink-3);margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.gl{margin-bottom:20px}
.gl b{display:block;font-size:16px;color:var(--ink);font-weight:500;margin-bottom:5px}
.gl p{margin:0;font-size:14.5px;color:var(--ink-2);line-height:1.55}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="phone">

  <header>
    <div class="who">
      <div class="hi" id="hHi">Bom dia</div>
      <div class="tt" id="hTt">Início</div>
    </div>
    <button class="icobtn" id="btEye" aria-label="Mostrar ou ocultar valores">👁</button>
    <button class="icobtn" id="btHelp" aria-label="Ajuda e glossário">?</button>
  </header>

  <main id="view"></main>
  <nav id="nav"></nav>

  <div class="backdrop" id="bd"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <div class="grab"></div>
    <div class="sh"><h2 id="shTitle"></h2><button class="icobtn" id="btClose" aria-label="Fechar">✕</button></div>
    <div class="sb" id="shBody"></div>
  </section>

  <div class="tour" id="tour"></div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   GRIMÓRIO v2 — protótipo com foco em usabilidade
   Dados fictícios. Em produção vêm do agregador + entrada manual.
   ═══════════════════════════════════════════════════════════════ */

const MERCADO={selic:.14,cdi:.139,ipca:.0444,poupanca:.0837,ref:'16/08/2026'};

const CONTAS=[
  {n:'Nubank',        sub:'Conta de pagamento', ic:'ᚾ',v:3842.17,rende:false},
  {n:'Itaú',          sub:'Conta corrente',     ic:'ᛁ',v:1190.00,rende:false},
  {n:'Inter',         sub:'Conta digital',      ic:'ᛖ',v: 640.55,rende:false},
  {n:'Mercado Pago',  sub:'Conta de pagamento', ic:'ᛗ',v: 210.00,rende:true,taxa:'100% do CDI'},
];
const CAIXINHAS=[
  {n:'Reserva de emergência',v:12400,taxa:100,meta:'Reserva de emergência'},
  {n:'Japão 2027',           v: 5000,taxa:120,meta:'Viagem — Japão',teto:5000},
  {n:'Aluguel de dezembro',  v: 2100,taxa:100},
  {n:'Presentes',            v:  480,taxa:100},
];
const ACERVO=[
  {c:'Renda fixa pós-fixada',      sg:'ᛚ',cor:'#5FBB80',risco:'baixo',itens:[
    {n:'Tesouro Selic 2029',        v:8300,idx:'Selic + 0,04%',liq:'Resgate em 1 dia',em:'Tesouro Nacional'},
    {n:'CDB liquidez diária',       v:4150,idx:'102% do CDI',  liq:'Resgate no mesmo dia',em:'Banco Inter'}]},
  {c:'Renda fixa prefixada',       sg:'ᛈ',cor:'#7CC79A',risco:'baixo',itens:[
    {n:'CDB prefixado 2027',        v:3000,idx:'12,80% ao ano',liq:'Só no vencimento',em:'Banco Master'}]},
  {c:'Protegido da inflação',      sg:'ᛇ',cor:'#96C77C',risco:'médio',itens:[
    {n:'Tesouro IPCA+ 2035',        v:6700,idx:'IPCA + 7,12%', liq:'Oscila se resgatar antes',em:'Tesouro Nacional'}]},
  {c:'Renda fixa isenta de IR',    sg:'ᛊ',cor:'#B6C77C',risco:'baixo',itens:[
    {n:'LCI Sofisa',                v:5000,idx:'95% do CDI',   liq:'Carência de 9 meses',em:'Banco Sofisa'}]},
  {c:'Ações do Brasil',            sg:'ᚦ',cor:'#DCA84B',risco:'alto',itens:[
    {n:'PETR4 · ITSA4 · WEGE3',     v:7450,idx:'Bolsa (B3)',   liq:'Resgate em 2 dias',em:'B3'},
    {n:'ETF BOVA11',                v:2100,idx:'Índice Ibovespa',liq:'Resgate em 2 dias',em:'BlackRock'}]},
  {c:'Fundos imobiliários',        sg:'ᛒ',cor:'#D19A5C',risco:'alto',itens:[
    {n:'MXRF11 · HGLG11',           v:4900,idx:'Dividendos isentos',liq:'Resgate em 2 dias',em:'B3'}]},
  {c:'Investimento internacional', sg:'ᛟ',cor:'#5FA3CC',risco:'alto',itens:[
    {n:'ETF IVVB11 (S&P 500)',      v:3600,idx:'S&P 500 em reais',liq:'Resgate em 2 dias',em:'BlackRock'}]},
  {c:'Criptoativos',               sg:'ᚲ',cor:'#A388E0',risco:'muito alto',itens:[
    {n:'Bitcoin',                   v:2250,idx:'Sem indexador',liq:'Imediata',em:'Autocustódia'}]},
  {c:'Previdência privada',        sg:'ᛗ',cor:'#9080D0',risco:'baixo',itens:[
    {n:'PGBL Icatu',                v:5800,idx:'CDI + 0,3%',   liq:'Pensado para o longo prazo',em:'Icatu'}]},
  {c:'Fundos multimercado',        sg:'ᚹ',cor:'#D07090',risco:'médio',itens:[
    {n:'Kinea Atlas II',            v:1900,idx:'CDI + ganho extra',liq:'Resgate em 31 dias',em:'Kinea'}]},
];
const DIVIDAS=[
  {n:'Parcelamento da fatura',sub:'Nubank',v:1850,taxa:.112},
  {n:'Empréstimo consignado', sub:'Inter', v:4200,taxa:.017},
];
const RENDA=7800;
const GASTOS=[
  {c:'Moradia',1:1450,m:1450,e:true},{c:'Mercado',1:980,m:870,e:true},
  {c:'Transporte',1:420,m:390,e:true},{c:'Saúde e farmácia',1:260,m:275,e:true},
  {c:'Educação',1:190,m:190,e:true},{c:'Água, luz e internet',1:650,m:640,e:true},
  {c:'Restaurantes e delivery',1:890,m:540,e:false},
  {c:'Assinaturas',1:312,m:214,e:false,rec:true},
  {c:'Lazer',1:380,m:350,e:false},{c:'Roupas',1:210,m:160,e:false},{c:'Presentes',1:120,m:110,e:false},
].map(g=>({cat:g.c,v:g[1],m3:g.m,ess:g.e,rec:g.rec}));

let METAS=[
  {n:'Reserva de emergência',alvo:23700,atual:24850,prazo:null,onde:'Caixinha 100% do CDI',taxa:.139},
  {n:'Viagem — Japão',       alvo:18000,atual:5000, prazo:'2027-10-01',onde:'Caixinha Turbo 120% do CDI',taxa:.1668},
  {n:'Trocar o notebook',    alvo:9000, atual:1200, prazo:'2027-03-01',onde:'CDB liquidez diária',taxa:.1529},
  {n:'Entrada do apartamento',alvo:60000,atual:6700,prazo:'2030-01-01',onde:'Tesouro IPCA+',taxa:.1150},
];

/* ─── utilidades ─── */
let ocultar=false;
const _brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const R$=n=>ocultar?'R$ ••••':_brl(n);
const pc=(n,d=1)=>(n*100).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const soma=a=>a.reduce((s,x)=>s+x,0);
const aoMes=a=>Math.pow(1+a,1/12)-1;
const irDe=d=>d<=180?.225:d<=360?.20:d<=720?.175:.15;
const mesesAte=iso=>Math.max(1,Math.round((new Date(iso)-new Date())/2629800000));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ─── totais ─── */
const T={};
T.contas=soma(CONTAS.map(c=>c.v));
T.parado=soma(CONTAS.filter(c=>!c.rende).map(c=>c.v));
T.caix=soma(CAIXINHAS.map(c=>c.v));
T.classes=ACERVO.map(c=>({...c,v:soma(c.itens.map(i=>i.v))}));
T.inv=soma(T.classes.map(c=>c.v));
T.div=soma(DIVIDAS.map(d=>d.v));
T.bruto=T.contas+T.caix+T.inv;
T.liq=T.bruto-T.div;
T.gastos=soma(GASTOS.map(g=>g.v));
T.ess=soma(GASTOS.filter(g=>g.ess).map(g=>g.v));
T.sobra=RENDA-T.gastos;
T.liquidez=T.caix+8300+4150;
T.meses=T.liquidez/T.ess;
const RISCO=['Ações do Brasil','Fundos imobiliários','Investimento internacional','Criptoativos','Fundos multimercado'];
const vRisco=soma(T.classes.filter(c=>RISCO.includes(c.c)).map(c=>c.v));
const vPrev=soma(T.classes.filter(c=>c.c==='Previdência privada').map(c=>c.v));
const vSeg=T.bruto-T.parado-vRisco-vPrev;
const ANEL=[
  {n:'Parado, sem render',    v:T.parado,cor:'#E0705A'},
  {n:'Rendendo com segurança',v:vSeg,    cor:'#5FBB80'},
  {n:'Rendendo com risco',    v:vRisco,  cor:'#DCA84B'},
  {n:'Aposentadoria',         v:vPrev,   cor:'#A388E0'},
];

/* ═══════════ MOTOR DO ORÁCULO ═══════════
   Cada leitura tem: frase simples (o que aparece de cara) e a conta
   (que só aparece se a pessoa pedir). Nenhuma emite ordem de compra. */
function ler(){
  const i=aoMes(MERCADO.cdi),out=[];

  const colchao=T.ess*.4, ocioso=Math.max(0,T.parado-colchao), perda=ocioso*i;
  out.push({id:'parado',sev:'urgente',t:'Você tem dinheiro parado',
    plain:`${R$(ocioso)} estão na conta sem render nada. Guardando esse valor em qualquer aplicação de liquidez imediata, seriam <b>${R$(perda)} por mês</b> a mais no seu bolso — sem travar o dinheiro.`,
    acao:'Ver onde posso colocar',
    math:`Na conta         ${_brl(T.parado)}\nGuardo p/ o mês  ${_brl(colchao)}\nSobra parado     ${_brl(ocioso)}\n\nCDI ao mês       ${pc(i,2)}\nDeixo de ganhar  ${_brl(perda)} por mês\nEm 12 meses      ${_brl(ocioso*MERCADO.cdi)}`,
    opts:['Caixinha com resgate imediato, rendendo 100% do CDI','Caixinha Turbo — rende mais, mas tem teto de R$ 5.000','Tesouro Selic ou CDB de liquidez diária','Abater a dívida mais cara'],
    con:'Custo de oportunidade — todo dinheiro parado tem um preço'});

  const cara=[...DIVIDAS].sort((a,b)=>b.taxa-a.taxa)[0];
  out.push({id:'divida',sev:'urgente',t:'Sua dívida cresce mais rápido que seu investimento',
    plain:`O ${cara.n.toLowerCase()} cobra <b>${pc(cara.taxa)} ao mês</b>. Sua melhor aplicação rende ${pc(i,2)} ao mês. Cada real usado para abater essa dívida vale mais do que qualquer investimento seguro hoje.`,
    acao:'Ver a conta',
    math:`Dívida       ${pc(cara.taxa)} ao mês → ${pc(Math.pow(1+cara.taxa,12)-1,0)} ao ano\nAplicação    ${pc(i,2)} ao mês → ${pc(MERCADO.cdi)} ao ano\nDiferença    ${pc(cara.taxa-i,2)} ao mês a favor de quitar\n\nSaldo hoje         ${_brl(cara.v)}\nSe ficar 12 meses  ${_brl(cara.v*Math.pow(1+cara.taxa,12))}`,
    opts:['Quitar tudo, mantendo a reserva de emergência intacta','Quitar em partes, com o que está parado na conta','Buscar portabilidade para uma taxa menor'],
    con:'Abater dívida cara é o único retorno garantido que existe'});

  out.push({id:'reserva',sev:T.meses>=6?'saudavel':'atencao',t:'Sua reserva de emergência está de pé',
    plain:`Você tem ${R$(T.liquidez)} disponíveis rapidamente — o suficiente para <b>${T.meses.toFixed(1)} meses</b> sem nenhuma renda entrando. A referência é de 6 meses.`,
    acao:'Ver como calculei',
    math:`Gastos essenciais  ${_brl(T.ess)} por mês\nAlvo de 6 meses    ${_brl(T.ess*6)}\nVocê tem           ${_brl(T.liquidez)}\nCobre              ${T.meses.toFixed(1)} meses`,
    opts:['Manter esse valor onde está, com resgate rápido','Se a renda for variável, mirar 9 a 12 meses'],
    con:'Poupança de precaução — o colchão que evita recorrer ao crédito caro'});

  const an=GASTOS.map(g=>({...g,d:(g.v-g.m3)/g.m3})).filter(g=>g.d>.25).sort((a,b)=>b.d-a.d);
  if(an.length){const a=an[0];
    out.push({id:'gasto',sev:'atencao',t:`${a.cat} fugiu do seu padrão`,
      plain:`Você gastou <b>${R$(a.v-a.m3)} a mais</b> que a sua própria média dos últimos 3 meses. Isso é ${pc((a.v-a.m3)/T.sobra,0)} de tudo que sobrou no mês.`,
      acao:'Ver as outras categorias',
      math:`Média dos 3 meses  ${_brl(a.m3)}\nEste mês           ${_brl(a.v)}\nDiferença          +${pc(a.d,0)}\n\n`+an.slice(1).map(x=>`${x.cat.padEnd(18)} +${pc(x.d,0)}`).join('\n'),
      con:'Comparação com o seu próprio histórico, não com a média dos outros'});}

  const rec=GASTOS.find(g=>g.rec);
  out.push({id:'assin',sev:'atencao',t:'9 assinaturas cobrando todo mês',
    plain:`São ${R$(rec.v)} por mês, ou <b>${R$(rec.v*12)} por ano</b>. Duas delas não são usadas há mais de 60 dias.`,
    acao:'Ver o efeito no longo prazo',
    math:`Por mês            ${_brl(rec.v)}\nPor ano            ${_brl(rec.v*12)}\nSe rendessem 5 anos ${_brl(rec.v*(Math.pow(1+aoMes(MERCADO.cdi),60)-1)/aoMes(MERCADO.cdi))}`,
    opts:['Cancelar as duas sem uso','Trocar planos mensais por anuais nas que você usa'],
    con:'Custo silencioso — pequeno por mês, grande no acumulado'});

  const p=[T.ess/RENDA,(T.gastos-T.ess)/RENDA,T.sobra/RENDA];
  out.push({id:'orc',sev:p[2]<.2?'atencao':'saudavel',t:'Como sua renda se divide',
    plain:`<b>${pc(p[0],0)}</b> vão para contas obrigatórias, <b>${pc(p[1],0)}</b> para coisas que você escolhe e <b>${pc(p[2],0)}</b> sobram. A referência mais usada sugere guardar pelo menos 20%.`,
    acao:'Ver a referência completa',
    math:`Obrigatórias  ${pc(p[0],0).padStart(5)}   (referência 50%)\nEscolhas      ${pc(p[1],0).padStart(5)}   (referência 30%)\nGuardado      ${pc(p[2],0).padStart(5)}   (referência 20%)\n\nFalta por mês ${_brl(Math.max(0,RENDA*.2-T.sobra))}`,
    con:'Regra 50/30/20 — um ponto de partida, não uma lei'});

  const liq=MERCADO.cdi*(1-.175),real=(1+liq)/(1+MERCADO.ipca)-1;
  out.push({id:'real',sev:'contexto',t:'O que sobra depois da inflação',
    plain:`Render ${pc(MERCADO.cdi)} ao ano parece muito, mas depois do imposto e da inflação o ganho real de poder de compra é de <b>${pc(real)} ao ano</b>.`,
    acao:'Ver a conta',
    math:`Rendimento anunciado  ${pc(MERCADO.cdi)}\nDepois do imposto     ${pc(liq)}\nInflação (IPCA 12m)   ${pc(MERCADO.ipca)}\nGanho real            ${pc(real)}\n\nSeu dinheiro dobra de valor real em ${(72/(real*100)).toFixed(0)} anos`,
    con:'Rendimento real — o número que realmente importa'});

  const nu=CONTAS[0].v+T.caix;
  out.push({id:'conc',sev:'contexto',t:'Boa parte está num banco só',
    plain:`${R$(nu)} — ${pc(nu/T.bruto,0)} do que você tem — estão no Nubank. Ainda dentro da proteção do FGC, que cobre até R$ 250 mil por banco.`,
    acao:'Ver os limites',
    math:`No Nubank        ${_brl(nu)}\nLimite do FGC    ${_brl(250000)} por banco\nFolga            ${_brl(250000-nu)}\nLimite total     ${_brl(1000000)} por CPF a cada 4 anos`,
    con:'Diversificar não é só entre tipos de investimento, é entre bancos também'});

  const ordem={urgente:0,atencao:1,contexto:2,saudavel:3};
  return out.sort((a,b)=>ordem[a.sev]-ordem[b.sev]);
}
const LEITURAS=ler();

const DESTINOS=[
  {n:'Deixar na conta',           aa:0,     ir:false,ob:'Não rende nada'},
  {n:'Poupança',                  aa:.0837, ir:false,ob:'Sem imposto, mas rende só no aniversário'},
  {n:'Caixinha 100% do CDI',      aa:.139,  ir:true, ob:'Resgate imediato, com proteção do FGC'},
  {n:'Caixinha Turbo 120% do CDI',aa:.1668, ir:true, teto:5000,ob:'Teto de R$ 5.000 e exige movimentar a conta'},
  {n:'Tesouro Selic',             aa:.138,  ir:true, ob:'Resgate em 1 dia, o mais seguro do país'},
  {n:'CDB liquidez diária 110%',  aa:.1529, ir:true, ob:'Resgate no mesmo dia, com FGC'},
  {n:'LCI 95% do CDI',            aa:.132,  ir:false,ob:'Sem imposto, mas fica preso 9 meses'},
  {n:'Abater a fatura parcelada', aa:Math.pow(1.112,12)-1,ir:false,ob:'Retorno garantido: o juro que você deixa de pagar'},
];

/* ═══════════ COMPONENTES ═══════════ */
const anel=()=>{const R=76,C=2*Math.PI*R;let o=0;
  const s=ANEL.map(a=>{const L=a.v/T.bruto*C;const el=`<circle cx="93" cy="93" r="${R}" fill="none" stroke="${a.cor}" stroke-width="15" stroke-linecap="butt" stroke-dasharray="${Math.max(0,L-3)} ${C-L+3}" stroke-dashoffset="${-o}"/>`;o+=L;return el}).join('');
  return `<svg width="186" height="186" viewBox="0 0 186 186" aria-hidden="true"><circle cx="93" cy="93" r="${R}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="15"/>${s}</svg>`};

const card=(o)=>`<div class="card${o.tap?' tap':''}" style="--acc:${o.cor}"${o.tap?` role="button" tabindex="0" data-act="${o.tap}"${o.val?` data-val="${o.val}"`:''}`:''}><div class="in">${o.html}</div></div>`;

/* ═══════════ TELAS ═══════════ */
const TELAS={};

TELAS.inicio=()=>{
  const top=LEITURAS[0];
  return `
  <div class="hero">
    <div class="lbl">Seu patrimônio hoje</div>
    <div class="big">${R$(T.liq)}</div>
    <div class="sub">Deste total, <b>${R$(T.parado)}</b> estão parados sem render.</div>
  </div>

  <div class="first">
    <div class="in">
      <div class="kicker"><span class="dot"></span>Comece por aqui</div>
      <h3>${top.t}</h3>
      <p>${top.plain}</p>
      <button class="btn" style="--acc:var(--ouro)" data-act="irOraculo" data-val="${top.id}">${top.acao}</button>
    </div>
  </div>

  <div class="sec">
    <div class="sec-h"><h2>Onde está seu dinheiro</h2></div>
    ${card({cor:'var(--ouro)',html:`
      <div class="ringbox">
        <div class="ring">${anel()}<div class="core"><b>${pc(1-T.parado/T.bruto,0)}</b><span>está rendendo</span></div></div>
        <div class="legend">${ANEL.map(a=>`
          <div class="lg"><i style="background:${a.cor}"></i><span class="n">${a.n}</span>
          <span class="v">${R$(a.v)}</span><span class="p">${pc(a.v/T.bruto,0)}</span></div>`).join('')}
        </div>
      </div>`})}
  </div>

  <div class="sec">
    <div class="sec-h"><h2>Seus grupos</h2></div>
    ${card({cor:'var(--azul)',tap:'ir',val:'contas',html:`
      <div class="chead"><span class="sg">ᚠ</span><span class="nm">Contas do banco</span><span class="ex">›</span></div>
      <div class="val-lg">${R$(T.contas)}</div>
      <div style="font-size:14px;color:var(--ink-3);margin-top:6px">${CONTAS.length} contas · ${R$(T.parado)} sem render</div>`})}
    ${card({cor:'var(--ambar)',tap:'ir',val:'contas',html:`
      <div class="chead"><span class="sg">ᛒ</span><span class="nm">Guardado em caixinhas</span><span class="ex">›</span></div>
      <div class="val-lg">${R$(T.caix)}</div>
      <div style="font-size:14px;color:var(--ink-3);margin-top:6px">${CAIXINHAS.length} caixinhas · rendendo 100% a 120% do CDI</div>`})}
    ${card({cor:'var(--verde)',tap:'ir',val:'investido',html:`
      <div class="chead"><span class="sg">ᛚ</span><span class="nm">Investido</span><span class="ex">›</span></div>
      <div class="val-lg">${R$(T.inv)}</div>
      <div style="font-size:14px;color:var(--ink-3);margin-top:6px">${ACERVO.length} tipos de investimento</div>`})}
    ${card({cor:'var(--brasa)',tap:'ir',val:'contas',html:`
      <div class="chead"><span class="sg">ᚲ</span><span class="nm">Dívidas</span><span class="ex">›</span></div>
      <div class="val-lg" style="color:#F0A08C">− ${R$(T.div)}</div>
      <div style="font-size:14px;color:var(--ink-3);margin-top:6px">A mais cara cobra 11,2% ao mês</div>`})}
  </div>

  <div class="sec">
    <div class="sec-h"><h2>Seu mês</h2><span class="cnt">Agosto</span></div>
    ${card({cor:'var(--azul)',html:`
      ${[['Entrou',RENDA,'#5FBB80'],['Saiu',T.gastos,'#E0705A'],['Sobrou',T.sobra,'#5FA3CC']].map(([n,v,c])=>`
        <div style="margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <span style="font-size:15px;color:var(--ink-2)">${n}</span>
            <span class="mono" style="font-size:17px;color:${c}">${R$(v)}</span></div>
          <div class="bar" style="--acc:${c}"><i style="width:${Math.min(100,v/RENDA*100)}%"></i></div>
        </div>`).join('')}
      <div style="font-size:14px;color:var(--ink-3);margin-top:4px">Você guardou ${pc(T.sobra/RENDA,0)} do que ganhou este mês.</div>`})}
    ${card({cor:'var(--ambar)',html:`
      <div class="chead"><span class="sg">ᛉ</span><span class="nm">Maiores gastos</span></div>
      ${[...GASTOS].sort((a,b)=>b.v-a.v).slice(0,5).map(g=>`
        <div class="row"><div class="tx"><b>${g.cat}</b><span>${g.ess?'Conta obrigatória':'Escolha sua'}</span></div>
        <div class="rt"><b>${R$(g.v)}</b>${g.v>g.m3*1.15?`<span class="pill no">+${pc((g.v-g.m3)/g.m3,0)} vs média</span>`:''}</div></div>`).join('')}`})}
  </div>

  <p class="note">Selic ${pc(MERCADO.selic)} · CDI ${pc(MERCADO.cdi)} · Inflação 12 meses ${pc(MERCADO.ipca)} — atualizado em ${MERCADO.ref}.</p>`};

TELAS.contas=()=>`
  <div class="sec" style="margin-top:16px">
    <div class="sec-h"><h2>Contas do banco</h2><span class="cnt">${R$(T.contas)}</span></div>
    ${card({cor:'var(--azul)',html:CONTAS.map(c=>`
      <div class="row"><span class="ic">${c.ic}</span>
        <div class="tx"><b>${c.n}</b><span>${c.sub}</span></div>
        <div class="rt"><b>${R$(c.v)}</b><span class="pill ${c.rende?'ok':'no'}">${c.rende?c.taxa:'não rende'}</span></div></div>`).join('')})}

function simular(){
  const el=document.getElementById('simOut');if(!el)return;
  const linhas=DESTINOS.map(d=>{
    const dentro=d.teto?Math.min(simVal,d.teto):simVal, fora=d.teto?Math.max(0,simVal-d.teto):0;
    const g=(dentro*d.aa*(d.ir?1-irDe(365):1))+(fora*.139*(1-irDe(365)));
    return {n:d.n,ob:d.ob,g};
  }).sort((a,b)=>b.g-a.g);
  const max=linhas[0].g||1;
  el.innerHTML=linhas.map((l,k)=>`
    <div style="margin-top:18px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
        <span style="font-size:15px;color:var(--ink)">${l.n}${k===0?' <span class="pill ok" style="margin-left:4px">melhor</span>':''}</span>
        <span class="mono" style="font-size:16px;color:${l.g>0?'#8FD9AC':'var(--ink-3)'}">+${_brl(l.g)}</span></div>
      <div class="bar" style="--acc:${k===0?'var(--verde)':'var(--ambar)'}"><i style="width:${Math.max(2,l.g/max*100)}%"></i></div>
      <div style="font-size:13px;color:var(--ink-3);margin-top:7px">${l.ob}</div>
    </div>`).join('');
}

/* ═══════════ ESTADO E NAVEGAÇÃO ═══════════ */
const NAV=[
  {id:'inicio',   g:'ᛝ',t:'Início',   tit:'Início'},
  {id:'contas',   g:'ᚠ',t:'Contas',   tit:'Contas'},
  {id:'investido',g:'ᛚ',t:'Investido',tit:'Investido'},
  {id:'metas',    g:'ᛞ',t:'Metas',    tit:'Metas'},
  {id:'oraculo',  g:'◬',t:'Oráculo',  tit:'Oráculo'},
];
let tela='inicio', aberto=new Set(), filtro='tudo', simVal=2500;
const rolagem={};                       // guarda onde cada aba parou
const $view=()=>document.getElementById('view');

function render(anim){
  const t=NAV.find(x=>x.id===tela);
  document.getElementById('hTt').textContent=t.tit;
  const h=new Date().getHours();
  document.getElementById('hHi').textContent=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  const m=$view();
  m.innerHTML=TELAS[tela]();
  if(anim){m.removeAttribute('data-anim');void m.offsetWidth;m.dataset.anim='1'}
  document.getElementById('nav').innerHTML=NAV.map(x=>`
    <button data-nav="${x.id}" aria-current="${x.id===tela?'page':'false'}">
      <span class="g" aria-hidden="true">${x.g}</span><span class="t">${x.t}</span></button>`).join('');
  if(tela==='oraculo'){simular();
    const sl=document.getElementById('sl');
    if(sl)sl.addEventListener('input',e=>{simVal=+e.target.value;
      e.target.previousElementSibling.querySelector('.mono').textContent=_brl(simVal);simular()});}
}
function ir(id){
  if(id===tela){$view().scrollTo({top:0,behavior:'smooth'});return}   // tocar na aba atual volta ao topo
  rolagem[tela]=$view().scrollTop;
  tela=id;render(true);
  $view().scrollTop=rolagem[id]||0;
  document.querySelector('header').dataset.scrolled=($view().scrollTop>4)?'1':'0';
}

/* ═══════════ AÇÕES ═══════════ */
const ACOES={
  ir:v=>ir(v),
  toggle:v=>{aberto.has(v)?aberto.delete(v):aberto.add(v);const y=document.getElementById('view').scrollTop;render();document.getElementById('view').scrollTop=y},
  filtro:v=>{filtro=v;render()},
  simchip:v=>{simVal=+v;render()},
  irOraculo:v=>{tela='oraculo';aberto=new Set([v]);filtro='tudo';render();
    setTimeout(()=>document.getElementById('ins-'+v)?.scrollIntoView({behavior:'smooth',block:'center'}),60)},
  delMeta:v=>{const m=METAS[+v];
    abrirFolha('Remover meta',`<p style="font-size:16px;line-height:1.55;color:var(--ink-2)">Tem certeza que quer remover <b style="color:var(--ink)">${esc(m.n)}</b>? O histórico dessa meta será perdido.</p>
    <button class="btn dgr" data-act="confDel" data-val="${v}">Sim, remover</button>
    <button class="btn sec" data-act="fechar">Cancelar</button>`)},
  confDel:v=>{const m=METAS.splice(+v,1)[0];fecharFolha();render();aviso(`"${m.n}" foi removida`)},
  novaMeta:()=>abrirFolha('Nova meta',formMeta()),
  prazo:(v,el)=>{el.parentNode.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false'));
    el.setAttribute('aria-pressed','true');document.getElementById('fMeses').value=v;
    document.getElementById('fData').value='';previewMeta()},
  salvarMeta:()=>{
    const n=document.getElementById('fNome').value.trim();
    const alvo=+document.getElementById('fAlvo').dataset.raw||0;
    const atual=+document.getElementById('fAtual').dataset.raw||0;
    const meses=mesesForm();
    const sel=document.getElementById('fOnde');
    if(!n){aviso('Dê um nome para a meta');return}
    if(alvo<=0){aviso('Informe quanto custa');return}
    METAS.push({n,alvo,atual,prazo:new Date(Date.now()+meses*2629800000).toISOString().slice(0,10),
      onde:sel.options[sel.selectedIndex].text,taxa:+sel.value});
    fecharFolha();tela='metas';render();aviso('Meta criada');
  },
  fechar:()=>fecharFolha(),
};

function formMeta(){return `

  <div class="field"><label for="fAlvo">Quanto custa?</label>
    <div class="inp"><span class="pre">R$</span><input id="fAlvo" class="mono" inputmode="numeric" placeholder="0,00" data-money="1"></div></div>

  <div class="field"><label for="fAtual">Você já tem algum valor guardado?</label>
    <div class="inp"><span class="pre">R$</span><input id="fAtual" class="mono" inputmode="numeric" placeholder="0,00" data-money="1"></div>
    <div class="hint">Pode deixar zerado se estiver começando agora.</div></div>

  <div class="field"><label>Para quando?</label>
    <div class="chips" style="--acc:var(--violeta)">
      ${[[6,'6 meses'],[12,'1 ano'],[24,'2 anos'],[60,'5 anos']].map(([v,l],k)=>`
        <button class="chip" data-act="prazo" data-val="${v}" aria-pressed="${k===1}">${l}</button>`).join('')}
    </div>
    <input type="hidden" id="fMeses" value="12">
    <div class="inp" style="margin-top:10px"><span class="pre">ou</span><input type="date" id="fData"></div></div>

  <div class="field"><label for="fOnde">Onde vai guardar?</label>
    <div class="inp"><select id="fOnde">
      ${DESTINOS.filter(d=>d.aa>0&&d.aa<.2).map(d=>`<option value="${d.aa}">${d.n}</option>`).join('')}
    </select><span class="pre">▾</span></div>
    <div class="hint">O rendimento reduz o quanto você precisa guardar por mês.</div></div>

  <div class="preview" id="prev">
    <div class="l">Você vai precisar guardar</div>
    <div class="v" id="prevV">R$ 0,00</div>
    <div class="n" id="prevN">por mês, até chegar lá</div>
  </div>

  <button class="btn" style="--acc:var(--violeta)" data-act="salvarMeta">Salvar meta</button>
  <button class="btn sec" data-act="fechar">Cancelar</button>`}

function mesesForm(){
  const d=document.getElementById('fData')?.value;
  if(d){const m=mesesAte(d);return m>0?m:1}
  return +(document.getElementById('fMeses')?.value||12);
}
function previewMeta(){
  const alvo=+document.getElementById('fAlvo')?.dataset.raw||0;
  const atual=+document.getElementById('fAtual')?.dataset.raw||0;
  const ms=mesesForm(), sel=document.getElementById('fOnde');
  const i=aoMes(+sel.value), c=Math.pow(1+i,ms);
  const pmt=Math.max(0,(alvo-atual*c)*i/(c-1));
  const semRend=Math.max(0,(alvo-atual)/ms);
  document.getElementById('prevV').textContent=_brl(pmt);
  document.getElementById('prevN').textContent=alvo>0
    ? `por mês, durante ${ms} ${ms>1?'meses':'mês'}. Sem render nada seriam ${_brl(semRend)} — o rendimento poupa ${_brl(Math.max(0,semRend-pmt))} por mês.`
    : 'por mês, até chegar lá';
}
function mascara(el){
  const d=el.value.replace(/\D/g,'').slice(0,11);
  el.dataset.raw=d?(parseInt(d,10)/100):'';
  el.value=d?(parseInt(d,10)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):'';
}

}
function abrirTour(){passo=0;tour.dataset.open='1';pintarTour()}
tour.addEventListener('click',e=>{
  const b=e.target.closest('[data-tour]');if(!b)return;
  if(b.dataset.tour==='skip'||passo>=PASSOS.length-1){tour.dataset.open='0';return}
  passo++;pintarTour();
});

/* ═══════════ LIGAÇÕES ═══════════ */
function despachar(e){
  const el=e.target.closest('[data-act]');if(!el)return;
  e.preventDefault();
  if(el.dataset.act==='tour'){fecharFolha();abrirTour();return}
  ACOES[el.dataset.act]?.(el.dataset.val,el);
}
document.getElementById('view').addEventListener('click',despachar);
document.getElementById('shBody').addEventListener('click',despachar);
document.getElementById('view').addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.closest('[data-act]')){despachar(e)}});
document.getElementById('shBody').addEventListener('input',e=>{
  if(e.target.dataset.money)mascara(e.target);
  if(document.getElementById('prev'))previewMeta();
});
document.getElementById('shBody').addEventListener('change',()=>{if(document.getElementById('prev'))previewMeta()});
document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('[data-nav]');if(b)ir(b.dataset.nav)});
document.getElementById('btEye').addEventListener('click',()=>{
  ocultar=!ocultar;document.getElementById('btEye').textContent=ocultar?'🙈':'👁';render();
  aviso(ocultar?'Valores ocultos':'Valores visíveis')});
document.getElementById('btHelp').addEventListener('click',abrirAjuda);
document.getElementById('btClose').addEventListener('click',fecharFolha);
bd.addEventListener('click',fecharFolha);
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecharFolha()});

/* Sombra no cabeçalho quando o conteúdo rola por baixo dele */
$view().addEventListener('scroll',()=>{
  document.querySelector('header').dataset.scrolled=$view().scrollTop>4?'1':'0';
},{passive:true});

/* Reajusta a altura quando o teclado abre ou a tela gira */
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',()=>{
    document.querySelector('.phone').style.height=window.visualViewport.height+'px';
  });
}

render();
abrirTour();

/* PWA: permite instalar na tela inicial e abrir sem internet */
if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
