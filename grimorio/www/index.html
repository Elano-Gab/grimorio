<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Meu Mês</title>
<meta name="theme-color" content="#0B0B0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Mês">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --fundo:#0B0B0C; --sup:#121213; --sup2:#191919;
  --tinta:#EDEBE7; --tinta2:#9A9893; --tinta3:#67655F;
  --risco:rgba(255,255,255,.075); --risco2:rgba(255,255,255,.14);
  --destaque:#C89A4E; --positivo:#6E9E72; --negativo:#C4574A;
  --sans:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --serif:'Instrument Serif',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  font-family:var(--sans);font-size:16px;line-height:1.5;color:var(--tinta);background:#000;
  display:flex;justify-content:center;align-items:center;padding:20px 12px;font-variant-numeric:tabular-nums}
@media(max-width:640px){body{padding:0;align-items:stretch}}
.app{position:relative;width:100%;max-width:420px;height:100vh;height:min(900px,calc(100dvh - 40px));
  display:flex;flex-direction:column;overflow:hidden;background:var(--fundo);border:1px solid #1C1C1E;border-radius:18px}
@media(max-width:640px){.app{border:0;border-radius:0;max-width:none;height:100vh;height:100dvh}}

header{flex:none;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 20px 13px;
  border-bottom:1px solid transparent;transition:border-color .2s}
header[data-rolou="1"]{border-bottom-color:var(--risco)}
header .tt{flex:1;font-family:var(--serif);font-size:22px;line-height:1.1}
header .sub{font-size:12px;color:var(--tinta3);margin-top:2px}
.ico{width:34px;height:34px;flex:none;display:grid;place-items:center;background:none;border:1px solid var(--risco2);
  border-radius:8px;color:var(--tinta2);font-size:14px;cursor:pointer;font-family:var(--sans)}
.ico:active{background:var(--sup2)}
main{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;padding:0 20px 100px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
main[data-anim="1"]{animation:ap .2s ease}
@keyframes ap{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){main[data-anim="1"]{animation:none}}

.rotulo{font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--tinta3)}
.apoio{font-size:13px;color:var(--tinta3);line-height:1.5}
.xl{font-family:var(--serif);font-size:clamp(46px,15vw,60px);line-height:.95;letter-spacing:-.025em}
.g{font-family:var(--serif);font-size:26px;line-height:1;letter-spacing:-.02em}
.neg{color:var(--negativo)}
.pos{color:var(--positivo)}

.topo{padding:28px 0 6px}
.topo .xl{margin-top:12px}
.topo .exp{margin-top:14px;font-size:14px;color:var(--tinta2);line-height:1.55}
.topo .exp b{color:var(--tinta);font-weight:600}

.conta{margin-top:22px;border:1px solid var(--risco);border-radius:10px;overflow:hidden}
.conta .l{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:13px 15px;border-bottom:1px solid var(--risco)}
.conta .l:last-child{border-bottom:0}
.conta .l.total{background:var(--sup)}
.conta .l .n{font-size:14px;color:var(--tinta2)}
.conta .l .n s{display:block;font-size:11.5px;color:var(--tinta3);text-decoration:none;margin-top:3px}
.conta .l .v{font-size:15px;font-weight:500;flex:none}
.conta .l.total .n{color:var(--tinta);font-weight:600;font-size:15px}
.conta .l.total .v{font-size:17px;font-weight:600}

.limite{margin-top:26px;padding-top:20px;border-top:1px solid var(--risco)}
.limite .cab{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.limite .barra{height:8px;border-radius:4px;background:var(--risco2);overflow:hidden;margin-top:12px;position:relative}
.limite .barra i{display:block;height:100%;border-radius:4px;background:var(--destaque);transition:width .35s}
.limite .barra i.estourou{background:var(--negativo)}
.limite .barra u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tinta2);border-radius:1px}
.limite .leg{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:12.5px;color:var(--tinta3)}
.limite .frase{margin-top:14px;font-size:14px;color:var(--tinta2);line-height:1.55}
.limite .frase b{color:var(--tinta);font-weight:600}

.aviso{display:block;width:100%;text-align:left;margin-top:22px;padding:14px 15px;border-radius:10px;
  background:var(--sup);border:1px solid var(--risco);border-left:2px solid var(--destaque);cursor:pointer;font-family:var(--sans)}
.aviso[data-s="urgente"]{border-left-color:var(--negativo)}
.aviso h3{margin:0;font-size:14.5px;font-weight:600}
.aviso p{margin:5px 0 0;font-size:13.5px;line-height:1.5;color:var(--tinta2)}

.sec{margin-top:30px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px;
  padding-bottom:9px;border-bottom:1px solid var(--risco)}
.sec-h h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--tinta3)}
.sec-h button{background:none;border:0;color:var(--destaque);font-family:var(--sans);font-size:13px;cursor:pointer;padding:6px 0;min-height:34px}
.sec-h .cnt{font-size:12px;color:var(--tinta3)}

.item{display:flex;align-items:baseline;gap:12px;padding:13px 0;border-bottom:1px solid var(--risco);cursor:pointer}
.item:last-child{border-bottom:0}
.item:active{opacity:.6}
.item .d{width:36px;flex:none;font-size:11.5px;color:var(--tinta3)}
.item .n{flex:1;min-width:0}
.item .n b{display:block;font-size:14.5px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .n s{display:block;font-size:12px;color:var(--tinta3);text-decoration:none;margin-top:3px}
.item .v{flex:none;font-size:14.5px;font-weight:500}

.cat{padding:13px 0;border-bottom:1px solid var(--risco)}
.cat:last-child{border-bottom:0}
.cat .cab{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.cat .nome{font-size:14.5px}
.cat .val{font-size:14.5px;font-weight:500}
.cat .tr{height:3px;background:var(--risco2);margin-top:9px;border-radius:2px;overflow:hidden}
.cat .tr i{display:block;height:100%;background:var(--tinta2);border-radius:2px}
.cat .sub{margin-top:7px;font-size:12px;color:var(--tinta3)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:12px 16px;
  margin-top:12px;cursor:pointer;font-family:var(--sans);font-size:15px;font-weight:500;border-radius:8px;
  color:#111;background:var(--destaque);border:1px solid var(--destaque)}
.btn:active{opacity:.8}
.btn.sec{background:none;color:var(--tinta);border-color:var(--risco2)}
.btn.dgr{background:none;color:var(--negativo);border-color:rgba(196,87,74,.4)}
.btn.sm{min-height:42px;font-size:13.5px;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{min-height:42px;padding:10px 14px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--tinta2);
  background:none;border:1px solid var(--risco2);font-family:var(--sans)}
.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#111;font-weight:500}
.chip.mini{min-height:38px;padding:8px 12px;font-size:13.5px}
.segs{display:flex;margin:16px 0 4px;border:1px solid var(--risco2);border-radius:8px;overflow:hidden}
.segs button{flex:1;min-height:42px;border:0;border-right:1px solid var(--risco2);background:none;color:var(--tinta3);
  font-family:var(--sans);font-size:14px;cursor:pointer}
.segs button:last-child{border-right:0}
.segs button[aria-pressed="true"]{background:var(--sup2);color:var(--tinta);font-weight:500}

.campo{margin-top:20px}
.campo>label{display:block;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta3);margin-bottom:9px}
.campo .dica{font-size:12.5px;color:var(--tinta3);margin-top:8px;line-height:1.5}
.inp{display:flex;align-items:center;gap:8px;min-height:48px;border-bottom:1px solid var(--risco2)}
.inp:focus-within{border-bottom-color:var(--destaque)}
.inp .pre{font-size:15px;color:var(--tinta3)}
.inp input,.inp select{flex:1;width:100%;min-width:0;background:none;border:0;outline:none;color:var(--tinta);
  font-family:var(--sans);font-size:16px;padding:12px 0;font-variant-numeric:tabular-nums}
.inp select{-webkit-appearance:none;appearance:none}
.inp select option{background:#191919;color:var(--tinta)}
.inp.grande{min-height:64px}
.inp.grande input{font-family:var(--serif);font-size:38px;padding:8px 0;letter-spacing:-.02em}
.res{margin-top:20px;padding-top:16px;border-top:1px solid var(--risco)}
.res .l{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta3)}
.res .v{font-family:var(--serif);font-size:30px;margin-top:8px;letter-spacing:-.02em}
.res .n{font-size:12.5px;color:var(--tinta3);margin-top:8px;line-height:1.5}

nav{flex:none;display:flex;padding:0 8px calc(env(safe-area-inset-bottom));background:var(--fundo);border-top:1px solid var(--risco)}
nav button{flex:1;min-height:54px;background:none;border:0;cursor:pointer;position:relative;color:var(--tinta3);
  font-family:var(--sans);font-size:12.5px;font-weight:500}
nav button[aria-current="page"]{color:var(--tinta)}
nav button[aria-current="page"]::before{content:'';position:absolute;top:-1px;left:16%;right:16%;height:1px;background:var(--destaque)}
.mais{position:absolute;right:20px;bottom:calc(70px + env(safe-area-inset-bottom));width:50px;height:50px;border-radius:50%;
  border:0;cursor:pointer;background:var(--destaque);color:#111;font-size:25px;display:grid;place-items:center;font-family:var(--sans)}
.mais:active{opacity:.8}

.fundo{position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.7);display:none}
.fundo[data-on="1"]{display:block}
.folha{position:absolute;left:0;right:0;bottom:0;z-index:11;max-height:92%;display:none;flex-direction:column;
  background:var(--sup);border-top:1px solid var(--risco2);border-radius:14px 14px 0 0;animation:sobe .22s ease}
.folha[data-on="1"]{display:flex}
@keyframes sobe{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.folha{animation:none}}
.folha .puxa{width:36px;height:3px;border-radius:3px;background:var(--risco2);margin:10px auto 2px;flex:none}
.folha .cab{display:flex;align-items:center;gap:10px;padding:10px 20px 14px;border-bottom:1px solid var(--risco);flex:none}
.folha .cab h2{flex:1;margin:0;font-family:var(--serif);font-size:20px;font-weight:400}
.folha .corpo{overflow-y:auto;overscroll-behavior:contain;padding:4px 20px calc(28px + env(safe-area-inset-bottom))}
.folha .corpo::-webkit-scrollbar{display:none}

.vazio{padding:36px 0;text-align:left}
.vazio p{font-size:15px;color:var(--tinta2);margin:0;max-width:290px;line-height:1.6}
.nota{font-size:12.5px;line-height:1.6;color:var(--tinta3);margin-top:26px;padding-top:14px;border-top:1px solid var(--risco)}
.toast{position:absolute;left:20px;right:20px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:30;padding:13px 15px;
  border-radius:8px;background:var(--sup2);border:1px solid var(--risco2);font-size:14px;display:none;align-items:center;gap:10px}
.toast[data-on="1"]{display:flex}
.dia{font-size:11px;color:var(--tinta3);letter-spacing:.09em;text-transform:uppercase;font-weight:600;margin:24px 0 0}

.setup{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;background:var(--fundo)}
.setup[data-on="1"]{display:flex}
.setup .corpo{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px;overflow-y:auto}
.setup .passo{font-size:12px;color:var(--tinta3);margin-bottom:16px}
.setup h2{font-family:var(--serif);font-size:31px;font-weight:400;letter-spacing:-.02em;margin:0 0 12px;line-height:1.15}
.setup p{font-size:15.5px;line-height:1.6;color:var(--tinta2);margin:0 0 8px;max-width:330px}
.setup .pe{padding:14px 28px calc(24px + env(safe-area-inset-bottom));flex:none}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div><div class="tt" id="tit">Meu mês</div><div class="sub" id="sub"></div></div>
    <button class="ico" data-a="olho" id="olho" aria-label="Ocultar valores">👁</button>
    <button class="ico" data-a="ajustes" aria-label="Ajustes">⚙</button>
  </header>
  <main id="tela"></main>
  <button class="mais" data-a="novo" id="mais" aria-label="Registrar">+</button>
  <nav id="nav"></nav>
  <div class="fundo" data-a="fechar" id="fundo"></div>
  <section class="folha" id="folha" role="dialog" aria-modal="true">
    <div class="puxa"></div>
    <div class="cab"><h2 id="ftit"></h2><button class="ico" data-a="fechar" aria-label="Fechar">✕</button></div>
    <div class="corpo" id="fcorpo"></div>
  </section>
  <div class="setup" id="setup"></div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════
   MEU MÊS — controle financeiro simples

   Modelado no fluxo do limite garantido:
   o salário fica na caixinha rendendo, as compras vão no cartão,
   e a fatura come parte da caixinha no vencimento.

   O saldo da caixinha, sozinho, engana: parte dele já tem dono.
   Por isso o número principal do app é o LIVRE DE VERDADE:
       caixinha − fatura em aberto − reservado em metas
   ══════════════════════════════════════════════════════════════ */

const gv=(k,v)=>{try{localStorage.setItem('mm.'+k,JSON.stringify(v))}catch(e){}};
const lv=(k,p)=>{try{const v=localStorage.getItem('mm.'+k);return v?JSON.parse(v):p}catch(e){return p}};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);

const CATS=['Contas de casa','Mercado','Comer fora','Transporte','Casa','Roupas',
  'Lazer','Saúde','Assinaturas','Educação','Presentes','Pets'];
const ENTRADAS=['Salário','Vale refeição','Freelance','Reembolso','Venda','13º ou férias','Rendimento'];

const novo=()=>({
  caixinha:{nome:'Caixinha',inicial:0,cdi:120},
  limite:0,
  cartao:{fechamento:28,vencimento:8},
  lanc:[], fixas:[], metas:[], cats:CATS.slice(),
});
let DB=lv('db',null)||novo();
const salvar=()=>gv('db',DB);

/* ─── formatos ─── */
let ocultar=lv('ocultar',false);
const brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const R=n=>ocultar?'R$ ••••':brl(n);
const pc=(n,d=0)=>((n||0)*100).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const sm=a=>a.reduce((s,x)=>s+(x||0),0);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hoje=()=>new Date().toISOString().slice(0,10);
const mesDe=d=>String(d).slice(0,7);
const mesHoje=()=>hoje().slice(0,7);
const nomeMes=m=>{const[a,b]=m.split('-');return new Date(a,b-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
const diasMes=m=>{const[a,b]=m.split('-').map(Number);return new Date(a,b,0).getDate()};
let mes=mesHoje();

/* ══════════ CONTAS ══════════ */
let T={};
function calc(){
  const L=DB.lanc, dom=L.filter(l=>mesDe(l.data)===mes);
  T.mes=mes;

  /* saldo da caixinha: tudo que entrou menos tudo que saiu dela */
  T.caixinha=DB.caixinha.inicial
    + sm(L.filter(l=>l.t==='entrada'||l.t==='rendimento').map(l=>l.v))
    - sm(L.filter(l=>l.t==='gasto'&&l.meio!=='credito').map(l=>l.v))
    - sm(L.filter(l=>l.t==='fatura'||l.t==='retirada').map(l=>l.v));

  /* fatura: compras no crédito ainda não pagas */
  T.fatura=sm(L.filter(l=>l.t==='gasto'&&l.meio==='credito'&&!l.pago).map(l=>l.v));
  T.reservado=sm(DB.metas.map(m=>m.guardado));
  T.livre=T.caixinha-T.fatura-T.reservado;

  /* mês corrente */
  T.entrou=sm(dom.filter(l=>l.t==='entrada').map(l=>l.v));
  T.gastou=sm(dom.filter(l=>l.t==='gasto').map(l=>l.v));
  T.guardou=T.entrou-T.gastou;
  T.noCredito=sm(dom.filter(l=>l.t==='gasto'&&l.meio==='credito').map(l=>l.v));

  const porCat=new Map();
  dom.filter(l=>l.t==='gasto').forEach(l=>porCat.set(l.cat,(porCat.get(l.cat)||0)+l.v));
  T.cats=[...porCat.entries()].map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v);

  T.limite=DB.limite;
  T.sobrouLimite=DB.limite-T.gastou;
  T.ehAtual=mes===mesHoje();
  T.dia=T.ehAtual?new Date().getDate():diasMes(mes);
  T.dias=diasMes(mes);
  T.faltam=Math.max(0,T.dias-T.dia);
  T.porDia=T.ehAtual&&T.faltam>0?Math.max(0,T.sobrouLimite)/T.faltam:0;
  T.projecao=T.ehAtual&&T.dia>2?T.gastou/T.dia*T.dias:T.gastou;

  /* rendimento estimado do mês, para dar noção do ganho da estratégia */
  const cdiAno=.139*(DB.caixinha.cdi/100);
  T.rendeMes=T.caixinha*(Math.pow(1+cdiAno,1/12)-1);

  /* fixas ainda não lançadas neste mês */
  T.pendentes=DB.fixas.filter(f=>f.ativo!==false&&!L.some(l=>l.fixaId===f.id&&mesDe(l.data)===mes));

  T.vazio=L.length===0;
}

/* ══════════ COMPONENTES ══════════ */
const linha=(n,v,sub,cls='')=>`<div class="l ${cls}"><span class="n">${n}${sub?`<s>${sub}</s>`:''}</span>
  <span class="v ${v<0?'neg':''}">${v<0?'− ':''}${R(Math.abs(v))}</span></div>`;

/* ══════════ TELAS ══════════ */
const TELAS={};

TELAS.mes=()=>{
  if(T.vazio&&!DB.caixinha.inicial)return `
    <div class="topo"><div class="rotulo">Comece aqui</div><div class="xl">${R(0)}</div>
      <div class="exp">Diga quanto tem guardado hoje e quanto quer poder gastar no mês. O resto é só ir registrando.</div></div>
    <button class="btn" data-a="setup">Configurar em 3 passos</button>
    <button class="btn sec" data-a="exemplo">Ver com dados de exemplo</button>`;

  const estourou=T.sobrouLimite<0;
  const usado=DB.limite>0?Math.min(150,T.gastou/DB.limite*100):0;
  const tempo=T.ehAtual?T.dia/T.dias*100:100;

  return `
  <div class="topo">
    <div class="rotulo">Livre de verdade</div>
    <div class="xl ${T.livre<0?'neg':''}">${R(Math.abs(T.livre))}</div>
    <div class="exp">${T.livre<0
      ?'Sua fatura e suas metas já passam do que tem na caixinha.'
      :`É o que sobra da caixinha depois de separar a fatura e o que já é das metas.`}</div>

    <div class="conta">
      ${linha('Na caixinha',T.caixinha,DB.caixinha.cdi+'% do CDI · rende '+R(T.rendeMes)+' no mês')}
      ${linha('Fatura em aberto',-T.fatura,'já foi gasto, só não saiu ainda')}
      ${T.reservado>0?linha('Guardado em metas',-T.reservado,'reservado, não é para gastar'):''}
      ${linha('Livre de verdade',T.livre,'','total')}
    </div>
  </div>

  ${DB.limite>0?`<div class="limite">

    <div class="sec-h"><h2>Onde foi o dinheiro</h2><span class="cnt">${nomeMes(mes)}</span></div>

      <div class="cat"><div class="cab"><span class="nome">${esc(c.n)}</span><span class="val">${R(c.v)}</span></div>

const item=l=>{
  const ent=l.t==='entrada'||l.t==='rendimento';
  const rot={gasto:'',entrada:'entrada',rendimento:'rendimento da caixinha',fatura:'pagamento da fatura',retirada:'tirou da caixinha'}[l.t];
  const meio={credito:'crédito',debito:'débito ou Pix',dinheiro:'dinheiro',vale:'vale refeição'}[l.meio]||'';
  return `<div class="item" data-a="editar" data-v="${l.id}">
    <span class="d">${l.data.slice(8)}/${l.data.slice(5,7)}</span>
    <span class="n"><b>${esc(l.desc||l.cat||rot||'Registro')}</b>
      <s>${esc([l.cat!==l.desc?l.cat:'',meio,rot].filter(Boolean).join(' · '))}</s></span>
    <span class="v ${ent?'pos':''}">${ent?'+':'−'} ${R(l.v)}</span></div>`;
};

TELAS.gastos=()=>{
  const L=DB.lanc.filter(l=>mesDe(l.data)===mes).sort((a,b)=>b.data.localeCompare(a.data)||b.id.localeCompare(a.id));
  const dias=new Map();
  L.forEach(l=>{if(!dias.has(l.data))dias.set(l.data,[]);dias.get(l.data).push(l)});
  return `
  <div class="segs">
    <button data-a="mesAnt" style="flex:0 0 46px">‹</button>
    <button style="flex:3" aria-pressed="true">${nomeMes(mes)}</button>
    <button data-a="mesProx" style="flex:0 0 46px">›</button></div>

  <div class="conta" style="margin-top:18px">
    ${linha('Entrou',T.entrou)}${linha('Gastou',-T.gastou)}${linha('Sobrou',T.guardou,'','total')}
  </div>

  ${T.pendentes.length?`<button class="aviso" data-a="lancarFixas">
    <h3>Lançar ${T.pendentes.length} ${T.pendentes.length>1?'contas fixas':'conta fixa'}</h3>
    <p>${esc(T.pendentes.map(f=>f.nome).join(' · '))}</p></button>`:''}

  ${L.length?[...dias.entries()].map(([d,ls])=>`
    <div class="dia">${new Date(d+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'short'})}</div>

TELAS.caixinha=()=>{

      ${T.fatura>0?`Mas <b>${R(T.fatura)}</b> já estão comprometidos com a fatura.`:''}</div>
    <div class="conta">

TELAS.metas=()=>`
  <div class="sec" style="margin-top:18px">
    <div class="sec-h"><h2>Meus objetivos</h2><span class="cnt">${DB.metas.length}</span></div>
    ${DB.metas.length?DB.metas.map(m=>{
      const falta=Math.max(0,m.alvo-m.guardado), p=Math.min(1,m.guardado/m.alvo);
      let frase;
      if(falta<=0)frase='Alcançado.';
      else if(m.prazo){
        const ms=Math.max(1,Math.round((new Date(m.prazo)-new Date())/2629800000));
        frase=`Faltam ${R(falta)} — ${R(falta/ms)} por mês durante ${ms} ${ms>1?'meses':'mês'}.`;
      }else frase=`Faltam ${R(falta)}.`;
      return `<div class="cat" style="padding:18px 0">
        <div class="cab"><span style="font-family:var(--serif);font-size:21px">${esc(m.nome)}</span>
          <span class="val ${falta<=0?'pos':''}">${pc(p)}</span></div>
        <div class="tr" style="height:5px;margin-top:12px"><i style="width:${p*100}%;${falta<=0?'background:var(--positivo)':''}"></i></div>
        <div class="sub" style="display:flex;justify-content:space-between;gap:10px;margin-top:10px">
          <span>${frase}</span><span>${R(m.guardado)} de ${R(m.alvo)}</span></div>
        <div style="display:flex;gap:8px">
          <button class="btn sec sm" style="flex:1" data-a="guardar" data-v="${m.id}">Guardar</button>
          <button class="btn sec sm" style="flex:1;color:var(--tinta3)" data-a="apagarMeta" data-v="${m.id}">Apagar</button></div>
      </div>`}).join('')

const A={
  ir:v=>vai(v),
  fechar:()=>fechaFolha(),
  olho:()=>{ocultar=!ocultar;gv('ocultar',ocultar);
    document.getElementById('olho').textContent=ocultar?'🙈':'👁';mantem()},
  mesAnt:()=>{const d=new Date(mes+'-01T12:00');d.setMonth(d.getMonth()-1);mes=d.toISOString().slice(0,7);pinta()},
  mesProx:()=>{const d=new Date(mes+'-01T12:00');d.setMonth(d.getMonth()+1);const m=d.toISOString().slice(0,7);
    if(m>mesHoje()){aviso('Esse mês ainda não chegou');return}mes=m;pinta()},

  novo:()=>{f={t:'gasto',data:hoje(),meio:'credito',v:0,cat:'',desc:''};abre('Registrar',formLanc)},
  novoTipo:v=>{f={t:v,data:hoje(),v:0,cat:v==='entrada'?'':'',desc:''};abre('Registrar',formLanc)},
  editar:v=>{const l=DB.lanc.find(x=>x.id===v);if(!l)return;
    f={id:l.id,t:l.t,data:l.data,meio:l.meio,v:l.v,cat:l.cat,desc:l.desc};abre('Editar',formLanc)},
  tipo:v=>{if(f.t===v)return;f.t=v;f.cat='';f.meio=v==='gasto'?'credito':undefined;redesenha(formLanc)},
  cat:v=>{f.cat=v;redesenha(formLanc)},
  meio:v=>{f.meio=v;redesenha(formLanc)},
  data:v=>{f.data=v;redesenha(formLanc)},
  fixa:()=>{f.fixa=!f.fixa;redesenha(formLanc)},
  novaCat:()=>abre('Nova categoria',`
    <div class="campo"><label>Nome</label><div class="inp"><input id="nc" placeholder="Ex: Cabelo"></div></div>
    <button class="btn" data-a="salvarCat">Criar</button>
    <button class="btn sec" data-a="voltarLanc">Voltar</button>`),
  salvarCat:()=>{const n=document.getElementById('nc').value.trim();
    if(!n){aviso('Dê um nome');return}
    if(!DB.cats.includes(n))DB.cats.push(n);
    salvar();f.cat=n;abre('Registrar',formLanc)},
  voltarLanc:()=>abre('Registrar',formLanc),
  salvar:()=>{
    leCampos();
    if(!f.v||f.v<=0){aviso('Informe o valor');return}
    if((f.t==='gasto'||f.t==='entrada')&&!f.cat){aviso('Escolha uma categoria');return}
    if(f.id)Object.assign(DB.lanc.find(x=>x.id===f.id),f,{pago:f.meio!=='credito'});
    else{
      const l={id:uid(),t:f.t,data:f.data,v:f.v,cat:f.cat,meio:f.meio,desc:f.desc,pago:f.meio!=='credito'};
      DB.lanc.push(l);
      if(f.fixa)DB.fixas.push({id:uid(),t:'gasto',nome:f.desc||f.cat,v:f.v,cat:f.cat,
        dia:+f.data.slice(8),meio:f.meio,ativo:true});
    }
    salvar();fechaFolha();mes=mesDe(f.data);pinta();aviso(f.id?'Salvo':'Registrado')},
  apagar:v=>{DB.lanc=DB.lanc.filter(x=>x.id!==v);salvar();fechaFolha();pinta();aviso('Apagado')},

  pagarFatura:()=>{
    const v=T.fatura;
    DB.lanc.forEach(l=>{if(l.t==='gasto'&&l.meio==='credito')l.pago=true});
    DB.lanc.push({id:uid(),t:'fatura',data:hoje(),v,desc:'Pagamento da fatura',pago:true});
    salvar();pinta();aviso('Fatura paga — saiu da caixinha')},

  editarLimite:()=>{f={};abre('Limite do mês',formLimite)},
  salvarLimite:()=>{
    const g=id=>+(document.getElementById(id).dataset.raw||0);
    DB.limite=Math.max(0,g('lr')-g('lf')-g('lg'));
    salvar();fechaFolha();pinta();aviso('Limite definido')},

  novaMeta:()=>{f={};abre('Novo objetivo',formMeta)},
  prazo:(v,el)=>{el.parentNode.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false'));
    el.setAttribute('aria-pressed','true');document.getElementById('mp').value=v;previaMeta()},
  salvarMeta:()=>{
    const n=document.getElementById('mn').value.trim();
    const a=+(document.getElementById('ma').dataset.raw||0);
    if(!n||!a){aviso('Preencha o nome e o valor');return}
    const ms=+document.getElementById('mp').value;
    const d=new Date();d.setMonth(d.getMonth()+ms);
    DB.metas.push({id:uid(),nome:n,alvo:a,guardado:+(document.getElementById('mg').dataset.raw||0),
      prazo:ms?d.toISOString().slice(0,10):null});
    salvar();fechaFolha();tela='metas';pinta();aviso('Objetivo criado')},
  guardar:v=>abre('Guardar',`
    <p class="apoio" style="margin:6px 0 0">Quanto você separou para <b style="color:var(--tinta)">${esc(DB.metas.find(m=>m.id===v).nome)}</b>?
    O dinheiro continua na caixinha rendendo — só deixa de contar como livre.</p>
    <div class="campo"><label>Valor</label>
      <div class="inp grande"><span class="pre">R$</span><input id="gv" data-money="1" inputmode="numeric" placeholder="0,00"></div></div>
    <button class="btn" data-a="confGuardar" data-v="${v}">Guardar</button>
    <button class="btn sec" data-a="fechar">Cancelar</button>`),
  confGuardar:v=>{const x=+(document.getElementById('gv').dataset.raw||0);
    if(!x){aviso('Informe o valor');return}
    DB.metas.find(m=>m.id===v).guardado+=x;salvar();fechaFolha();pinta();aviso(brl(x)+' guardados')},
  apagarMeta:v=>{DB.metas=DB.metas.filter(m=>m.id!==v);salvar();pinta();aviso('Objetivo apagado')},

  ajustes:()=>abre('Ajustes',formAjustes),
  salvarAjustes:()=>{
    DB.caixinha.nome=document.getElementById('cn').value.trim()||'Caixinha';
    DB.caixinha.cdi=Math.max(0,+document.getElementById('cc').value||100);
    const alvo=+(document.getElementById('cs').dataset.raw||0);
    DB.caixinha.inicial+=alvo-T.caixinha;      // reconcilia com o saldo real
    salvar();fechaFolha();pinta();aviso('Ajustes salvos')},

  novaFixa:()=>{f={t:'gasto',v:0,cat:'',nome:'',dia:5,meio:'debito'};abre('Conta fixa',formFixa)},
  editarFixa:v=>{const x=DB.fixas.find(y=>y.id===v);if(!x)return;f={...x};abre('Conta fixa',formFixa)},
  tipoFixa:v=>{if(f.t===v)return;f.t=v;f.cat='';f.meio=v==='gasto'?'debito':undefined;redesenha(formFixa)},
  catFixa:v=>{f.cat=v;redesenha(formFixa)},
  meioFixa:v=>{f.meio=v;redesenha(formFixa)},
  salvarFixa:()=>{
    leCampos();
    if(!f.nome||!f.nome.trim()){aviso('Dê um nome');return}
    if(!f.v){aviso('Informe o valor');return}
    if(!f.cat){aviso('Escolha uma categoria');return}
    f.nome=f.nome.trim();f.dia=Math.min(31,Math.max(1,+f.dia||5));
    if(f.id)Object.assign(DB.fixas.find(x=>x.id===f.id),f);
    else DB.fixas.push({...f,id:uid(),ativo:true});
    salvar();abre('Ajustes',formAjustes);aviso(f.id?'Salva':'Cadastrada')},
  apagarFixa:v=>{DB.fixas=DB.fixas.filter(x=>x.id!==v);salvar();abre('Ajustes',formAjustes);aviso('Apagada')},
  lancarFixas:()=>{
    if(!T.pendentes.length){aviso('Nada pendente');return}
    let n=0;
    T.pendentes.slice().forEach(x=>{
      const dia=String(Math.min(x.dia||5,diasMes(mes))).padStart(2,'0');
      DB.lanc.push({id:uid(),fixaId:x.id,t:x.t,data:`${mes}-${dia}`,v:x.v,cat:x.cat,
        meio:x.meio,desc:x.nome,pago:x.meio!=='credito'});n++});
    salvar();pinta();aviso(n+' lançamento(s) criado(s)')},

  exemplo:()=>{exemplo();fechaFolha();pinta();aviso('Exemplo carregado')},
  apagarTudo:()=>abre('Apagar tudo',`
    <p style="font-size:16px;line-height:1.6;color:var(--tinta2)">Isso apaga todos os registros, contas fixas e objetivos. Não dá para desfazer.</p>
    <button class="btn dgr" data-a="confApagar">Sim, apagar</button>
    <button class="btn sec" data-a="fechar">Cancelar</button>`),
  confApagar:()=>{DB=novo();salvar();fechaFolha();tela='mes';pinta();aviso('Tudo apagado')},
  setup:()=>{sp=0;document.getElementById('setup').dataset.on='1';pintaSetup()},
};

function leCampos(){
  document.querySelectorAll('#fcorpo [data-c]').forEach(el=>{
    const c=el.dataset.c;
    if(el.dataset.money!==undefined)f[c]=el.dataset.raw?+el.dataset.raw:0;
    else if(c==='dia')f[c]=+el.value;
    else f[c]=el.value;
  });
}
const redesenha=fn=>{leCampos();document.getElementById('fcorpo').innerHTML=fn()};
function mascara(el){
  const d=el.value.replace(/\D/g,'').slice(0,11);
  el.dataset.raw=d?(parseInt(d,10)/100):'';
  el.value=d?(parseInt(d,10)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):'';
}
function previaMeta(){
  const el=document.getElementById('mres');if(!el)return;
  const a=+(document.getElementById('ma')?.dataset.raw||0);
  const g=+(document.getElementById('mg')?.dataset.raw||0);
  const ms=+(document.getElementById('mp')?.value||0);
  el.textContent=ms?brl(Math.max(0,(a-g)/ms)):brl(Math.max(0,a-g))+' no total';
}
function previaLimite(){
  const el=document.getElementById('lres');if(!el)return;
  const g=id=>+(document.getElementById(id)?.dataset.raw||0);
  const lim=g('lr')-g('lf')-g('lg');
  el.textContent=brl(Math.max(0,lim));
  const n=document.getElementById('lnota');
  n.textContent=lim<0?'As contas fixas mais o que você quer guardar passam do que entra.'
    :g('lr')>0?`Dá ${brl(Math.max(0,lim)/30)} por dia. Guardando ${pc(g('lg')/g('lr'))} do que entra.`
    :'O que entra, menos as fixas, menos o que você guarda.';
}

/* ══════════ NAVEGAÇÃO ══════════ */
const NAV=[{id:'mes',t:'Meu mês'},{id:'gastos',t:'Registros'},{id:'caixinha',t:'Caixinha'},{id:'metas',t:'Objetivos'}];
let tela='mes';
const rolagem={};
const $=()=>document.getElementById('tela');

function pinta(anim){
  calc();
  document.getElementById('tit').textContent=NAV.find(x=>x.id===tela).t;
  document.getElementById('sub').textContent=tela==='mes'?nomeMes(mes):'';
  const m=$();
  m.innerHTML=TELAS[tela]();
  if(anim){m.removeAttribute('data-anim');void m.offsetWidth;m.dataset.anim='1'}
  document.getElementById('mais').hidden=tela==='metas';
  document.getElementById('nav').innerHTML=NAV.map(x=>
    `<button data-a="ir" data-v="${x.id}" aria-current="${x.id===tela?'page':'false'}">${x.t}</button>`).join('');
}
const mantem=()=>{const y=$().scrollTop;pinta();$().scrollTop=y};
function vai(id){
  if(id===tela){$().scrollTo({top:0,behavior:'smooth'});return}
  rolagem[tela]=$().scrollTop;tela=id;pinta(true);$().scrollTop=rolagem[id]||0;
  document.querySelector('header').dataset.rolou='0';
}

/* ══════════ FOLHA E AVISOS ══════════ */
const fundo=document.getElementById('fundo'),folha=document.getElementById('folha');
function abre(titulo,conteudo){
  document.getElementById('ftit').textContent=titulo;
  document.getElementById('fcorpo').innerHTML=typeof conteudo==='function'?conteudo():conteudo;
  fundo.dataset.on='1';folha.dataset.on='1';
  const i=folha.querySelector('input:not([type=hidden]):not([type=date])');
  if(i)setTimeout(()=>i.focus({preventScroll:true}),250);
  previaMeta();previaLimite();
}
const fechaFolha=()=>{fundo.dataset.on='0';folha.dataset.on='0'};
let tid;
function aviso(m){const t=document.getElementById('toast');
  t.textContent=m;t.dataset.on='1';clearTimeout(tid);tid=setTimeout(()=>t.dataset.on='0',2400)}

/* ══════════ CONFIGURAÇÃO EM 3 PASSOS ══════════ */
const SETUP=[
  {t:'Quanto você tem guardado hoje?',p:'O saldo da sua caixinha, como está agora no app do banco.',
   campo:'saldo',pre:'R$',bt:'Continuar'},
  {t:'Quanto entra por mês?',p:'Seu salário, ou a média do que você recebe.',campo:'renda',pre:'R$',bt:'Continuar'},
  {t:'Quanto quer guardar por mês?',p:'Pode ser pouco. O importante é ter um número, para o limite de gastos sair dele.',
   campo:'poupar',pre:'R$',bt:'Pronto'},
];
let sp=0,cfg={};
const elSetup=document.getElementById('setup');
function pintaSetup(){
  const s=SETUP[sp];
  elSetup.innerHTML=`<div class="corpo">
    <div class="passo">Passo ${sp+1} de ${SETUP.length}</div>
    <h2>${s.t}</h2><p>${s.p}</p>
    <div class="inp grande" style="margin-top:20px"><span class="pre">${s.pre}</span>
      <input id="sv" data-money="1" inputmode="numeric" placeholder="0,00"
        data-raw="${cfg[s.campo]||''}" value="${cfg[s.campo]?cfg[s.campo].toLocaleString('pt-BR',{minimumFractionDigits:2}):''}"></div>
  </div>
  <div class="pe"><button class="btn" data-s="ok">${s.bt}</button>
    ${sp>0?'<button class="btn sec" data-s="volta">Voltar</button>':'<button class="btn sec" data-s="pula">Pular</button>'}</div>`;
  setTimeout(()=>document.getElementById('sv')?.focus({preventScroll:true}),200);
}
elSetup.addEventListener('input',e=>{if(e.target.dataset.money!==undefined)mascara(e.target)});
elSetup.addEventListener('click',e=>{
  const b=e.target.closest('[data-s]');if(!b)return;
  const acao=b.dataset.s;
  if(acao==='pula'){elSetup.dataset.on='0';gv('viu',true);return}
  if(acao==='volta'){sp--;pintaSetup();return}
  cfg[SETUP[sp].campo]=+(document.getElementById('sv').dataset.raw||0);
  if(sp<SETUP.length-1){sp++;pintaSetup();return}
  DB.caixinha.inicial=cfg.saldo||0;
  DB.limite=Math.max(0,(cfg.renda||0)-(cfg.poupar||0));
  if(cfg.renda)DB.fixas.push({id:uid(),t:'entrada',nome:'Salário',v:cfg.renda,cat:'Salário',dia:5,ativo:true});
  salvar();gv('viu',true);elSetup.dataset.on='0';pinta();
  aviso('Pronto. Agora é só registrar os gastos.');
});

/* ══════════ EXEMPLO ══════════ */
function exemplo(){
  const h=new Date(),a=h.getFullYear(),m=h.getMonth();
  const d=x=>new Date(a,m,Math.min(x,h.getDate())).toISOString().slice(0,10);
  DB=novo();
  DB.caixinha={nome:'Caixinha Turbo',inicial:2400,cdi:120};
  DB.limite=2600;
  DB.fixas=[
    {id:uid(),t:'entrada',nome:'Salário',v:4200,cat:'Salário',dia:5,ativo:true},
    {id:uid(),t:'gasto',nome:'Aluguel',v:1100,cat:'Contas de casa',dia:10,meio:'debito',ativo:true},
    {id:uid(),t:'gasto',nome:'Luz e internet',v:280,cat:'Contas de casa',dia:12,meio:'debito',ativo:true},
    {id:uid(),t:'gasto',nome:'Streamings',v:75,cat:'Assinaturas',dia:8,meio:'credito',ativo:true},
  ];
  const F=DB.fixas;
  DB.lanc=[
    {id:uid(),fixaId:F[0].id,t:'entrada',data:d(5),v:4200,cat:'Salário',meio:'debito',desc:'Salário',pago:true},
    {id:uid(),fixaId:F[1].id,t:'gasto',data:d(10),v:1100,cat:'Contas de casa',meio:'debito',desc:'Aluguel',pago:true},
    {id:uid(),fixaId:F[3].id,t:'gasto',data:d(8),v:75,cat:'Assinaturas',meio:'credito',desc:'Streamings'},
    {id:uid(),t:'gasto',data:d(6),v:420,cat:'Mercado',meio:'credito',desc:'Mercado do mês'},
    {id:uid(),t:'gasto',data:d(9),v:68,cat:'Comer fora',meio:'credito',desc:''},
    {id:uid(),t:'gasto',data:d(11),v:190,cat:'Transporte',meio:'credito',desc:''},
    {id:uid(),t:'gasto',data:d(13),v:145,cat:'Casa',meio:'credito',desc:'Panelas'},
    {id:uid(),t:'gasto',data:d(14),v:230,cat:'Roupas',meio:'credito',desc:''},
    {id:uid(),t:'gasto',data:d(15),v:90,cat:'Lazer',meio:'credito',desc:'Cinema'},
  ];
  DB.metas=[{id:uid(),nome:'Reserva de emergência',alvo:8000,guardado:1200,
    prazo:new Date(a+1,m,1).toISOString().slice(0,10)}];
  salvar();
}

/* ══════════ EVENTOS ══════════ */
document.getElementById('app').addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const fn=A[el.dataset.a];if(!fn)return;
  e.preventDefault();fn(el.dataset.v,el);
});
document.getElementById('fcorpo').addEventListener('input',e=>{
  if(e.target.dataset.money!==undefined)mascara(e.target);
  previaMeta();previaLimite();
});
$().addEventListener('scroll',()=>{
  document.querySelector('header').dataset.rolou=$().scrollTop>4?'1':'0'},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fechaFolha()});
if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{
  document.querySelector('.app').style.height=window.visualViewport.height+'px'});

pinta();
if(!lv('viu',false)&&!DB.lanc.length&&!DB.caixinha.inicial){sp=0;elSetup.dataset.on='1';pintaSetup()}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
