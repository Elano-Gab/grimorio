name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - run: npm install

      - run: |
          npx cap add android
          npx cap sync android

      - run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - run: mv android/app/build/outputs/apk/debug/app-debug.apk grimorio-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: grimorio-apk
          path: grimorio-${{ github.run_number }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Grimório — build ${{ github.run_number }}
          files: grimorio-${{ github.run_number }}.apk
